        seenPct[m.id] = pct;
        seenCounts[m.id] = countText;

        const card = document.createElement('div');
        card.className = 'ms-card'
          + (m.checked ? ' complete' : '')
          + (activeMilestoneFilter === m.id ? ' filtering' : '');
        card.dataset.ms = m.id;
        card.setAttribute('role', 'button');
        card.tabIndex = 0;
        card.title = m.title + (m.target ? ' — target ' + m.target : '');
        const overdue = !m.checked && m.target && m.target < dateStamp();
        card.innerHTML = `
          <div class="ms-card-top">
            <span class="ms-index">${pad2(i + 1)}</span>
            <span class="ms-title">${escapeHtml(m.title)}</span>
            ${m.checked ? `<span style="color: var(--accent); line-height: 0;">${icon('check', 12)}</span>` : ''}
            ${milestoneInconsistent(m) ? `<span style="color: var(--text-secondary); line-height: 0;" title="Marked done, but child tasks are still open">${icon('alert-triangle', 12)}</span>` : ''}
          </div>
          <div class="ms-meta">
            <span class="ms-target"${overdue ? ' style="color: var(--accent);" title="Target date passed with open tasks"' : ''}>${m.target ? 'target ' + m.target : 'no target'}</span>
            <span class="ms-count" data-ms-count-for="${m.id}">${countText}</span>
          </div>
          <div class="ms-progress"><div class="ms-progress-fill" data-ms-fill-for="${m.id}"></div></div>
        `;
        const filterBtn = document.createElement('button');
        filterBtn.className = 'ms-filter-btn';
        filterBtn.setAttribute('aria-label', activeMilestoneFilter === m.id ? 'Clear the milestone filter' : 'Filter the board to this milestone');
        filterBtn.title = filterBtn.getAttribute('aria-label');
        filterBtn.innerHTML = icon('crosshair', 13);
        filterBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          activeMilestoneFilter = activeMilestoneFilter === m.id ? null : m.id;
          renderTasks();
          showStatus(activeMilestoneFilter ? `Filtered to "${m.title}"` : 'Filter cleared');
        });
        card.appendChild(filterBtn);
        const open = () => openMilestoneModal(m);
        card.addEventListener('click', open);
        card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
        bodyEl.appendChild(card);
      });

      // "+ new milestone" tile lives at the end of the strip
      const newCard = document.createElement('button');
      newCard.className = 'ms-new-card';
      newCard.id = 'msNewCard';
      newCard.innerHTML = `${icon('plus', 12)} New milestone`;
      newCard.addEventListener('click', startAddingMilestone);
      if (!milestones.length) newCard.style.display = 'none';
      bodyEl.appendChild(newCard);
      milestoneRail.appendChild(bodyEl);

      // Micro-interactions: the fill SWEEPS from its previous width (never jumps), and a
      // changed count rolls through the Slot Roll like the column badges do.
      if (!railCollapsed) {
        milestones.forEach((m) => {
          const fill = bodyEl.querySelector(`[data-ms-fill-for="${m.id}"]`);
          if (fill) {
            const prev = lastMsPct[m.id];
            const next = seenPct[m.id];
            if (!prefersReducedMotion && prev !== undefined && prev !== next) {
              fill.style.transition = 'none';
              fill.style.width = prev + '%';
              requestAnimationFrame(() => requestAnimationFrame(() => {
                fill.style.removeProperty('transition');
                fill.style.width = next + '%';
              }));
            } else {
              fill.style.width = next + '%';
            }
          }
          const countEl = bodyEl.querySelector(`[data-ms-count-for="${m.id}"]`);
          const prevC = lastMsCounts[m.id];
          if (countEl && !prefersReducedMotion && prevC !== undefined && prevC !== seenCounts[m.id]) {
            buildSlotText(countEl, prevC);
            animateSlotText(countEl, seenCounts[m.id], { color: 'var(--accent)' });
          }
        });
      }
      lastMsPct = seenPct;
      lastMsCounts = seenCounts;
    }

    function startAddingMilestone() {
      const tile = document.getElementById('msNewCard');
      if (!tile) return;
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'ms-new-input';
      input.placeholder = 'Milestone title…';
      tile.replaceWith(input);
      input.focus();
      let committed = false;
      const commit = () => {
        if (committed) return; committed = true;
        const title = input.value.trim();
        if (title) {
          const m = { id: genTaskId(usedIds()), title, note: '', target: null, doneDate: null, checked: false };
          milestones.push(m);
          commitMilestones();
          saveMilestoneDetail(m.id, 'created (operator, from the board)');
          openMilestoneModal(m);
        } else {
          renderMilestoneRail();
        }
      };
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); commit(); }
        else if (e.key === 'Escape') { committed = true; renderMilestoneRail(); }
      });
      input.addEventListener('blur', commit);
    }

    async function openMilestoneModal(m) {
      if (operatorDialogPending) return;
      if (tmTask) { await closeTaskModal(); if (tmTask) return; }
      if (msTask && msTask !== m) { await closeMilestoneModal(); if (msTask) return; }
      msTask = m;
      msDescEditing = false;
      msDescExpanded = false;
      msTitleEl.value = m.title;
      msIdEl.textContent = '#' + m.id;
      msCheckboxEl.className = 'checkbox ' + (m.checked ? 'checked' : '');
      msModalOverlay.classList.add('visible');
      sizeTitle(msTitleEl);
      renderMsModalBody();
    }
    async function closeMilestoneModal() {
      if (operatorDialogPending) return;
      if (msDescSaving) { showStatus('The milestone description is still saving'); return; }
      const draft = document.querySelector('#msDescArea textarea');
      if (msDescEditing && draft && draft.value !== (msDetails[msTask?.id]?.description || '')
          && !(await boardDialog('Discard unsaved milestone description edits?'))) return;
      msModalOverlay.classList.remove('visible');
      msTask = null;
      if (msReloadDeferred) { msReloadDeferred = false; loadMilestonesFromServer().then(renderTasks); }
      msDescEditing = false;
    }

    function renderMsModalBody() {
      const m = msTask;
      if (!m) return;
      const d = msDetails[m.id] || (msDetails[m.id] = parseDetail(''));
      const prog = milestoneProgress(m);
      const pct = prog.total ? Math.round((prog.done / prog.total) * 100) : 0;
      const kids = milestoneChildren(m);

      const milestoneDraft = msDescEditing ? document.querySelector('#msDescArea textarea')?.value : undefined;
      msBodyEl.innerHTML = `
        <div class="tm-section-label">Target date</div>
        <input type="date" id="msTarget" class="tm-note-input" value="${m.target || ''}">

        <div class="tm-section-label">Note <span style="text-transform:none; letter-spacing:0; color:var(--text-muted); font-weight:normal;">— one-line context</span></div>
        <input type="text" id="msNote" class="tm-note-input" placeholder="Short context (one line)" value="${escapeHtml(m.note || '')}">

        <div class="tm-section-label">Progress <span class="tm-count-badge"><span class="done">${pad2(prog.done)}</span>/${pad2(prog.total)}${milestoneArchivedCount(m) ? ' · ' + milestoneArchivedCount(m) + ' archived' : ''}</span></div>
        <div class="ms-progress" style="height: 6px;"><div class="ms-progress-fill" style="width: ${pct}%;"></div></div>
        ${milestoneInconsistent(m) ? `<div class="tm-blocked">${icon('alert-triangle', 13)} Marked done, but child tasks are still open — finish them or uncheck</div>` : ''}

        <div class="tm-section-label tm-row-between"><span>Description</span><button class="tm-btn" id="msDescToggle">${msDescEditing ? 'Preview' : 'Edit'}</button></div>
        <div id="msDescArea"></div>

        <div class="tm-section-label">${icon('target', 12)} Tasks <span class="tm-count-badge">${kids.length} live${milestoneArchivedCount(m) ? ' · ' + milestoneArchivedCount(m) + ' archived' : ''}</span></div>
        <div id="msChildren"></div>

        <div class="tm-section-label">Activity</div>
        <ul class="tm-activity" id="msActivity"></ul>
      `;

      // Target / note
      const targetInput = document.getElementById('msTarget');
      targetInput.addEventListener('change', () => {
        const v = targetInput.value || null;
        if (v !== (m.target || null)) { m.target = v; commitMilestones(); }
      });
      const noteInput = document.getElementById('msNote');
      noteInput.addEventListener('change', () => {
        const v = noteInput.value.trim();
        if (v !== (m.note || '')) { m.note = v; commitMilestones(); }
      });

      // Description (Edit/Preview, persisted to milestones/<id>.md)
      const descArea = document.getElementById('msDescArea');
      const descToggle = document.getElementById('msDescToggle');
      if (msDescEditing) {
        descToggle.style.display = 'none';
        const ta = document.createElement('textarea');
        ta.className = 'tm-desc-edit';
        ta.value = milestoneDraft !== undefined ? milestoneDraft : d.description || '';
        ta.setAttribute('aria-label', 'Milestone description');
        ta.placeholder = 'TT;DR: the outcome this milestone represents and where it stands.\n\nThen: why these tasks are grouped, what is in and out of scope…';
        descArea.appendChild(ta);
        const actions = document.createElement('div');
        actions.style.cssText = 'display:flex; gap:8px; margin-top:8px; justify-content:flex-end;';
        actions.innerHTML = '<button class="tm-btn" id="msDescCancel">Cancel</button><button class="tm-btn" id="msDescSave" style="border-color:var(--accent); color:var(--accent);">Save description</button>';
        descArea.appendChild(actions);
        ta.focus();
        document.getElementById('msDescCancel').addEventListener('click', () => { msDescEditing = false; renderMsModalBody(); });
        document.getElementById('msDescSave').addEventListener('click', async event => {
          if (msDescSaving) return;
          msDescSaving = true;
          event.currentTarget.disabled = true;
          document.getElementById('msDescCancel').disabled = true;
          msBodyEl.inert = true;
          const prior = d.description, priorActivity = [...d.activity];
          d.description = ta.value;
          const saved = await saveMilestoneDetail(m.id, 'description edited (operator)');
          msDescSaving = false;
          msBodyEl.inert = false;
          if (!saved) {
            d.description = prior; d.activity = priorActivity;
            document.getElementById('msDescSave').disabled = false;
            document.getElementById('msDescCancel').disabled = false;
            showStatus('Milestone save failed — the draft remains open');
            return;
          }
          msDescEditing = false;
          renderMsModalBody(); showStatus('Description saved');
        });
      } else {
        mountCollapsibleDesc(descArea, d.description, {
          get: () => msDescExpanded,
          set: (v) => { msDescExpanded = v; },
        });
        descToggle.onclick = () => { msDescEditing = true; renderMsModalBody(); };
      }

      // Child tasks (live), then the archived lines from ## Completed
      const childrenEl = document.getElementById('msChildren');
      if (!kids.length && !milestoneArchivedCount(m)) {
        childrenEl.innerHTML = '<div style="font-style: italic; font-size: 13px; color: var(--text-muted); padding: 4px 0;">No tasks yet — assign one from a task\'s Milestone selector, or create tasks while filtered to this milestone.</div>';
      } else {
        kids.forEach(t => {
          const row = document.createElement('div');
          row.className = 'tm-ms-child' + (t.checked ? ' done' : '');
          const cb = document.createElement('button');
        cb.type = 'button'; cb.setAttribute('aria-label', 'Toggle check');
          cb.className = 'checkbox ' + (t.checked ? 'checked' : '');
          cb.disabled = true; cb.setAttribute('aria-label', t.checked ? 'Task complete' : 'Task open');
          cb.style.cssText = 'pointer-events: none; width: 15px; height: 15px; min-width: 15px; min-height: 15px;';
          const title = document.createElement('span');
          title.className = 't';
          title.textContent = t.title;
          const sect = document.createElement('span');
          sect.className = 'sect';
          sect.textContent = (sections.find(s => s.id === t.section) || {}).name || t.section;
          const jump = document.createElement('button');
          jump.className = 'tm-btn';
          jump.textContent = 'open';
          jump.setAttribute('aria-label', 'Open task ' + t.title);
          jump.addEventListener('click', async (e) => { e.stopPropagation(); await closeMilestoneModal(); if (!msTask) openTaskModal(t); });
          row.appendChild(cb); row.appendChild(title); row.appendChild(sect); row.appendChild(jump);
          childrenEl.appendChild(row);
        });
        (d.completed || []).forEach(line => {
          const row = document.createElement('div');
          row.className = 'tm-ms-archived';
          row.textContent = '· ' + line.replace(/^\[[xX]\]\s*/, '').replace(/\*\*/g, '');
          row.title = 'Archived from Completed — still counts toward progress';
          childrenEl.appendChild(row);
        });
      }

      // Activity (newest first, like the task modal)
      const ul = document.getElementById('msActivity');
      if (!d.activity || !d.activity.length) {
        const li = document.createElement('li');
        li.className = 'tm-empty';
        li.textContent = 'No recorded activity yet.';
        ul.appendChild(li);
      } else {
        [...d.activity].reverse().forEach(a => {
          const li = document.createElement('li');
          li.textContent = a;
          ul.appendChild(li);
        });
      }
    }

    // Milestone completion is a HARD gate: it cannot close while any child task is open.
    msCheckboxEl.addEventListener('click', async () => {
      if (msDescSaving) return;
      if (!msTask) return;
      if (!msTask.checked) {
        const open = milestoneOpenChildren(msTask);
        if (open.length) {
          denyNudge(`Blocked — ${open.length} task${open.length > 1 ? 's' : ''} still open in this milestone`, msCheckboxEl);
          return;
        }
        msTask.checked = true;
        msTask.doneDate = dateStamp();
        saveMilestoneDetail(msTask.id, `milestone completed (${await operatorName()})`);
      } else {
        msTask.checked = false;
        msTask.doneDate = null;
      }
      msCheckboxEl.className = 'checkbox ' + (msTask.checked ? 'checked' : '');
      commitMilestones();
      renderMsModalBody();
    });
    msTitleEl.addEventListener('change', () => {
      if (!msTask) return;
      const v = msTitleEl.value.replace(/\s+/g, ' ').trim();
      if (v && v !== msTask.title) { msTask.title = v; commitMilestones(); renderTasks(); }
      else msTitleEl.value = msTask.title;
    });
    document.getElementById('msClose').addEventListener('click', closeMilestoneModal);
    document.getElementById('msDoneBtn').addEventListener('click', closeMilestoneModal);
    document.getElementById('msDelete').addEventListener('click', async () => {
      if (!msTask) return;
      if (msDescSaving) { showStatus('The milestone description is still saving'); return; }
      const m = msTask;
      const kids = milestoneChildren(m);
      if (!(await boardDialog(`Delete milestone "${m.title}"?${kids.length ? ` Its (ms #${m.id}) tag will be removed from ${kids.length} task${kids.length > 1 ? 's' : ''}.` : ''}`))) return;
      msDescEditing = false;
      // Deleting a milestone must not leave dangling (ms #id) tags — untag the children,
      // remove the line, and drop the detail file, all together.
      kids.forEach(t => { t.milestoneId = null; });
      const idx = milestones.findIndex(x => x.id === m.id);
      if (idx !== -1) milestones.splice(idx, 1);
      delete msDetails[m.id];
      if (activeMilestoneFilter === m.id) activeMilestoneFilter = null;
      if (SERVER_MODE) fetch('/api/milestone?id=' + encodeURIComponent(m.id), {
        method: 'DELETE', headers: serverWriteHeaders(),
      }).then(verifyServerResponse).catch(() => {});
      closeMilestoneModal();
      commitMilestones();
      if (kids.length) markChanged();   // the untag changed TASKS.md
      renderTasks();
    });
    msModalOverlay.addEventListener('click', (e) => { if (e.target === msModalOverlay) closeMilestoneModal(); });

    // ============================================================
    // ===== FRESHNESS INDICATOR ("live" → seconds → "stale") =====
    // ============================================================
    // One 1/sec interval compares now against the last board update. < 2min → "live";
    // 2min..45min → counts up in seconds; ≥ 45min → "stale". Cheap: a single timer plus a
    // couple of class swaps — nothing per-card.
    let lastBoardUpdate = Date.now();
    let freshnessEl = null;
    let freshSlot = null;
    let lastFreshText = '';
    const FRESH_WINDOW_MS = 120000;        // 2 min "live"
    const STALE_AFTER_MS = 45 * 60000;     // 45 min → stale

    function markBoardUpdated() { lastBoardUpdate = Date.now(); updateFreshness(); }

    function updateFreshness() {
      if (!freshnessEl) return;
      const elapsed = Date.now() - lastBoardUpdate;
      let text, cls, title;
      if (elapsed < FRESH_WINDOW_MS) {
        text = 'live'; cls = 'fresh'; title = 'Board updated within the last 2 minutes';
      } else if (elapsed < STALE_AFTER_MS) {
        text = Math.floor(elapsed / 1000) + 's'; cls = 'aging'; title = 'Seconds since the last board change';
      } else {
        text = 'stale'; cls = 'stale'; title = 'No board changes in 45+ minutes — may be out of sync';
      }
      freshnessEl.classList.remove('fresh', 'aging', 'stale');
      freshnessEl.classList.add(cls);
      freshnessEl.title = title;
      if (text !== lastFreshText) {
        lastFreshText = text;
        if (freshSlot) freshSlot.set(text, { color: null });   // quiet odometer roll (no arrival flash)
        else freshnessEl.textContent = text;
      }
    }

    function startFreshnessClock() {
      if (!freshnessEl) {
        freshnessEl = document.createElement('span');
        freshnessEl.id = 'freshness';
        freshnessEl.style.marginLeft = '8px';
        freshnessEl.classList.add('fresh');
        if (filePathEl && filePathEl.parentElement) {
          filePathEl.parentElement.insertBefore(freshnessEl, filePathEl.nextSibling);
        } else {
          document.body.appendChild(freshnessEl);
        }
        freshSlot = attachSlotText(freshnessEl, 'live', { color: null });
        lastFreshText = 'live';
      }
      updateFreshness();
      setInterval(updateFreshness, 1000);
    }

    // ============================================================
    // ===== SLOT ROLL — short labels that change in place =====
    // ============================================================
    // Vanilla port of the QubeTX "slot roll" (DESIGN_SYSTEM § Slot roll), itself adapted
    // from slot-text v0.2.2 (MIT · textmotion.dev). Each character sits in its own clipped
    // cell; the new glyph rolls in while the old rolls out, landing with a small spring.
    // Themed for SHAUGHV: arrival flash is var(--accent) settling to ink (pass color:null for a
    // quiet odometer roll). Used on the column count badges (accent flash when a task moves) and
    // the freshness counter (quiet ticks). Respects prefers-reduced-motion — it snaps to the final
    // value. The per-glyph roll runs through a driver seam: when anime.js has loaded (full/vendor
    // tier) it drives the transform/rotate/color from the SAME computed tuple; otherwise the
    // built-in CSS-transition driver runs — identical motion, zero deps. FLIP stays on WAAPI.
    const SLOT_EASE = 'cubic-bezier(0.34, 1.56, 0.64, 1)';
    const SLOT_DEFAULTS = {
      direction: 'down', stagger: 40, duration: 240, exitOffset: 50, easing: SLOT_EASE,
      bounce: 0.3, color: 'var(--accent)', colorFade: 280, skipUnchanged: true, interrupt: true,
    };
    const SLOT_NBSP = ' ';
    const slotGlyph = (c) => (c === ' ' ? SLOT_NBSP : c);
    const slotStates = new WeakMap();

    function slotStyleContainer(el) {
      el.setAttribute('data-slot-text', '');
      el.style.display = 'inline-flex';
      el.style.whiteSpace = 'pre';
    }
    function slotMakeSr(text) {
      const sr = document.createElement('span');
      sr.setAttribute('data-slot-sr', '');
      Object.assign(sr.style, { position: 'absolute', width: '1px', height: '1px', overflow: 'hidden', clip: 'rect(0 0 0 0)', clipPath: 'inset(50%)', whiteSpace: 'nowrap' });
      sr.textContent = text;
      return sr;
    }
    function slotMakeFace(char) {
      const face = document.createElement('span');
      face.setAttribute('data-slot-face', '');
      Object.assign(face.style, { position: 'absolute', inset: '0', display: 'flex', alignItems: 'center', justifyContent: 'center', whiteSpace: 'pre' });
      face.textContent = slotGlyph(char);
      return face;
    }
    function slotBuildCell(char) {
      const slot = document.createElement('span');
      slot.setAttribute('data-slot-cell', '');
      slot.dataset.char = char;
      Object.assign(slot.style, { position: 'relative', display: 'inline-flex', flex: 'none', justifyContent: 'center', overflowX: 'visible', overflowY: 'clip', verticalAlign: 'bottom' });
      const sizer = document.createElement('span');
      sizer.setAttribute('data-slot-sizer', '');
      Object.assign(sizer.style, { visibility: 'hidden', whiteSpace: 'pre' });
      sizer.textContent = slotGlyph(char);
      slot.append(sizer, slotMakeFace(char));
      return slot;
    }
    function slotSettle(container) {
      const state = slotStates.get(container);
      if (!state) return;
      state.timers.forEach((t) => clearTimeout(t));
      slotStates.delete(container);
      buildSlotText(container, state.target);
    }
    function buildSlotText(container, text) {
      slotStyleContainer(container);
      const cells = Array.from(text, slotBuildCell);
      cells.forEach((c) => c.setAttribute('aria-hidden', 'true'));
      container.replaceChildren(slotMakeSr(text), ...cells);
    }
    // Driver seam — the per-glyph roll is computed into a backend-agnostic tuple, then APPLIED by
    // one of two drivers. anime.js (when loaded) and the built-in CSS-transition driver receive the
    // exact same numbers, so the motion is identical and "which library loaded" is invisible. We
    // re-check window.anime per call so a late-arriving anime.js is picked up without a reload.
    function slotUseAnime() { return typeof window !== 'undefined' && typeof window.anime === 'function'; }
    function animeEase(cssEasing) {
      const m = /cubic-bezier\(\s*([\d.+-]+)\s*,\s*([\d.+-]+)\s*,\s*([\d.+-]+)\s*,\s*([\d.+-]+)\s*\)/.exec(cssEasing || '');
      return m ? `cubicBezier(${m[1]}, ${m[2]}, ${m[3]}, ${m[4]})` : 'easeOutQuad';
    }
    // CSS driver: the original transform/rotate transitions + color fade, completion via
    // transitionend. This is the reference behaviour and the always-correct default.
    function slotDriveCss(roll, ctx) {
      const { oldFace, newFace, finishGlyph, timers } = ctx;
      const rollTrans = `transform ${roll.duration}ms ${roll.easing}`;
      const trans = roll.restColor != null ? `${rollTrans}, color ${roll.colorFade}ms linear ${roll.duration}ms` : rollTrans;
      if (oldFace) {
        timers.push(setTimeout(() => {
          oldFace.style.willChange = 'transform';
          oldFace.style.transition = rollTrans;
          oldFace.style.transform = `translateY(${roll.outY}px) rotate(${-Number(roll.tilt)}deg)`;
        }, roll.outDelay));
      }
      timers.push(setTimeout(() => {
        newFace.style.transition = trans;
        newFace.style.transform = 'translateY(0) rotate(0deg)';
        if (roll.restColor != null) newFace.style.color = roll.restColor;
        const done = (e) => {
          if (e.propertyName !== 'transform') return;
          newFace.removeEventListener('transitionend', done);
          finishGlyph();
        };
        newFace.addEventListener('transitionend', done);
      }, roll.inDelay));
    }
    // anime.js driver: same translateY/rotate endpoints, duration, delay and easing curve, fed to
    // anime() instead of CSS transitions. Completion fires finishGlyph (parity with transitionend).
    function slotDriveAnime(roll, ctx) {
      const { oldFace, newFace, finishGlyph, timers } = ctx;
      const ease = animeEase(roll.easing);
      if (oldFace) {
        oldFace.style.willChange = 'transform';
        window.anime({ targets: oldFace, translateY: [0, roll.outY], rotate: [0, -Number(roll.tilt)],
          duration: roll.duration, delay: roll.outDelay, easing: ease });
      }
      newFace.style.willChange = 'transform';
      window.anime({ targets: newFace, translateY: [roll.inStart, 0], rotate: [Number(roll.tilt), 0],
        duration: roll.duration, delay: roll.inDelay, easing: ease, complete: finishGlyph });
      if (roll.restColor != null && roll.tint != null) {
        window.anime({ targets: newFace, color: [roll.tint, roll.restColor],
          duration: roll.colorFade, delay: roll.inDelay + roll.duration, easing: 'linear' });
      }
    }
    function animateSlotText(container, toText, options = {}) {
      const { direction, stagger, duration, exitOffset, easing, bounce, color, colorFade, skipUnchanged, interrupt } = { ...SLOT_DEFAULTS, ...options };
      if (prefersReducedMotion) { slotSettle(container); buildSlotText(container, toText); return; }
      const running = slotStates.get(container);
      if (running && !interrupt) {
        if (toText !== running.target) running.pending = { text: toText, options };
        return;
      }
      slotSettle(container);
      if (!container.querySelector('[data-slot-cell]')) { buildSlotText(container, toText); return; }
      slotStyleContainer(container);
      const sr = container.querySelector('[data-slot-sr]');
      if (sr) sr.textContent = toText;
      const slots = Array.from(container.querySelectorAll('[data-slot-cell]'));
      const fromText = slots.map((s) => s.dataset.char || '').join('');
      if (!interrupt && fromText === toText) return;
      const maxLen = Math.max(fromText.length, toText.length);
      const sample = slots.find((s) => (s.dataset.char || '') !== '') || slots[0];
      const cs = getComputedStyle(container);
      const H = Math.ceil(
        (sample && sample.getBoundingClientRect().height) || (sample && sample.offsetHeight) ||
        container.getBoundingClientRect().height || parseFloat(cs.lineHeight) || 0
      ) || Math.ceil(parseFloat(cs.fontSize) * 1.3) || 18;
      const restColor = color ? cs.color : '';
      for (let i = slots.length; i < maxLen; i++) {
        const slot = slotBuildCell('');
        slot.setAttribute('aria-hidden', 'true');
        container.appendChild(slot);
        slots.push(slot);
      }
      const timers = [];
      const state = { timers, target: toText };
      slotStates.set(container, state);
      const outY = direction === 'down' ? H : -H;
      const inStart = direction === 'down' ? -H : H;
      const wobble = (i, salt) => {
        const n = Math.sin((i + 1) * 12.9898 + salt * 78.233) * 43758.5453;
        return (n - Math.floor(n)) * 2 - 1;
      };
      let maxEnd = 0;
      for (let i = 0; i < maxLen; i++) {
        const fromChar = fromText[i] || '';
        const toChar = toText[i] || '';
        if (fromChar === toChar && (skipUnchanged || fromChar === '')) continue;
        const slot = slots[i];
        const sizer = slot.querySelector('[data-slot-sizer]');
        const oldFace = slot.querySelector('[data-slot-face]');
        const oldW = slot.getBoundingClientRect().width;
        sizer.textContent = slotGlyph(toChar);
        const newW = sizer.getBoundingClientRect().width;
        const widthChanges = Math.abs(newW - oldW) > 0.5;
        if (widthChanges) slot.style.width = `${oldW}px`;
        if (fromChar === '' || toChar === '') slot.style.overflowX = 'clip';
        const tint = typeof color === 'function' ? color(i, maxLen) : color;
        const isTail = toChar === '';
        const d = Math.round(duration * (isTail ? 0.75 : 1) * (1 + bounce * 0.45 * wobble(i, 1)));
        const staggerIndex = isTail ? toText.length * 0.5 + (i - toText.length) * 0.25 : i;
        const base = Math.round(staggerIndex * stagger * (1 + bounce * 0.25 * wobble(i, 2)));
        const tilt = (bounce * 5 * wobble(i, 3)).toFixed(2);
        const newFace = slotMakeFace(toChar);
        newFace.style.willChange = 'transform';
        newFace.style.transformOrigin = '50% 50%';
        newFace.style.transform = `translateY(${inStart}px) rotate(${tilt}deg)`;
        if (tint) newFace.style.color = tint;
        slot.appendChild(newFace);
        void slot.offsetWidth;
        if (widthChanges) {
          let wDelay = base, wDur = d;
          if (isTail) { wDelay = base + Math.round(d * 0.55); wDur = Math.max(140, Math.round(d * 0.6)); }
          else if (fromChar === '') { wDur = Math.max(140, Math.round(d * 0.45)); }
          timers.push(setTimeout(() => {
            slot.style.transition = `width ${wDur}ms cubic-bezier(0.2, 0, 0, 1)`;
            slot.style.width = `${newW}px`;
          }, wDelay));
          maxEnd = Math.max(maxEnd, wDelay + wDur);
        }
        maxEnd = Math.max(maxEnd, base + exitOffset + d + (color ? colorFade : 0));
        // Backend-agnostic per-glyph roll tuple — IDENTICAL whether anime.js drives it or the
        // built-in CSS driver does (window.__slotTuples lets a test assert the parity). The driver
        // only chooses HOW to apply these numbers; cleanup (finishGlyph) is shared.
        const roll = {
          duration: d, outDelay: base, inDelay: base + exitOffset, easing,
          inStart, outY, tilt, colorFade,
          tint: color ? tint : null, restColor: color ? restColor : null,
        };
        if (typeof window !== 'undefined' && window.__slotTuples) window.__slotTuples.push(roll);
        const finishGlyph = () => {
          slot.dataset.char = toChar;
          slot.style.removeProperty('transition');
          slot.style.removeProperty('width');
          slot.style.overflowX = 'visible';
          slot.querySelectorAll('[data-slot-face]').forEach((f) => { if (f !== newFace) f.remove(); });
        };
        const driverCtx = { slot, oldFace, newFace, finishGlyph, timers };
        if (slotUseAnime()) slotDriveAnime(roll, driverCtx);
        else slotDriveCss(roll, driverCtx);
      }
      const total = maxEnd + 80;
      timers.push(setTimeout(() => {
        const pending = state.pending;
        slotStates.delete(container);
        buildSlotText(container, toText);
        if (pending) animateSlotText(container, pending.text, pending.options);
      }, total));
    }
    function attachSlotText(element, initialText, options = {}) {
      let value = initialText;
      buildSlotText(element, initialText);
      return {
        element,
        get value() { return value; },
        set(text, nextOptions = {}) { value = text; animateSlotText(element, text, { ...options, ...nextOptions }); },
      };
    }

    // Roll the column / section count badges from their previous value to the current one
    // whenever a task move changes a count. Persisted map (like the card signatures) so we
    // know the "before" value without a pre-render snapshot.
    let lastSectionCounts = {};
    function rollCounts(container) {
      const seen = {};
      sections.forEach((s) => {
        const cur = visibleTasks(s.id).length;
        seen[s.id] = cur;
        const el = container && container.querySelector(`[data-count-for="${s.id}"]`);
        if (!el) return;
        const prev = lastSectionCounts[s.id];
        if (!prefersReducedMotion && prev !== undefined && prev !== cur) {
          buildSlotText(el, String(prev));
          animateSlotText(el, String(cur), { color: 'var(--accent)' });
        }
      });
      lastSectionCounts = seen;
    }

    // ============================================================
    // ===== CARD MOVE / CHANGE ANIMATIONS (FLIP, dependency-free) =====
    // ============================================================
    // Native Web Animations API — framer-motion is React-only and anime.js would add a CDN
    // runtime dep; WAAPI gives the same board-quality motion while keeping this a single
    // self-contained file. A card that changes column glides via a position:fixed ghost
    // clone on a top-level overlay, so it isn't clipped by the column's own scroll box.
    const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
    let prefersReducedMotion = motionPreference.matches;
    motionPreference.addEventListener('change', event => {
      prefersReducedMotion = event.matches;
      if (event.matches) document.getAnimations().forEach(animation => { try { animation.finish(); } catch (_) { animation.cancel(); } });
    });
    let lastCardSignatures = new Map();

    function taskSignature(t) {
      const subs = (t.subtasks || []).map(s => (s.checked ? '1' : '0') + s.text + '>' + (s.description || '')).join('|');
      return [t.checked ? 1 : 0, t.section, t.title, t.note, (t.needs || []).join(','), t.milestoneId || '', t.owner || '', subs].join('¦');
    }
    function captureCardRects() {
      const map = new Map();
      document.querySelectorAll('#board .task-card[data-id]').forEach(c => {
        map.set(c.dataset.id, c.getBoundingClientRect());
      });
      return map;
    }
    function playBoardAnimations(prevRects) {
      const cards = document.querySelectorAll('#board .task-card[data-id]');
      // Skip motion while the task modal is open — the board is behind it, and a fixed
      // ghost (z-index 9000) would otherwise fly OVER the z-100 modal. Still refresh the
      // signature map so the next visible render diffs correctly.
      const modalOpen = !!(taskModalOverlay && taskModalOverlay.classList.contains('visible'));
      const nextSignatures = new Map();
      cards.forEach(card => {
        const id = card.dataset.id;
        const task = taskById(id);
        const newSig = task ? taskSignature(task) : undefined;
        if (newSig !== undefined) nextSignatures.set(id, newSig);
        if (prefersReducedMotion || modalOpen) return;

        const prev = prevRects && prevRects.get(id);
        const next = card.getBoundingClientRect();

        if (!prev) {
          // new (or first-paint) card — gentle fade/pop in place
          card.animate(
            [{ opacity: 0, transform: 'translateY(8px) scale(0.97)' }, { opacity: 1, transform: 'none' }],
            { duration: 240, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)' });
          return;
        }

        const dx = prev.left - next.left, dy = prev.top - next.top;
        if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
          // moved (column change or reorder): fly a ghost clone on a fixed overlay so it
          // glides over the gap between columns without being clipped by overflow.
          const ghost = card.cloneNode(true);
          ghost.classList.add('flip-ghost');
          ghost.style.cssText += `position:fixed; margin:0; left:${prev.left}px; top:${prev.top}px; width:${prev.width}px; height:${prev.height}px; z-index:9000; pointer-events:none;`;
          document.body.appendChild(ghost);
          card.style.visibility = 'hidden';
          const anim = ghost.animate(
            [{ transform: 'translate(0, 0)' }, { transform: `translate(${next.left - prev.left}px, ${next.top - prev.top}px)` }],
            { duration: 380, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)' });
          const cleanup = () => { ghost.remove(); if (card.isConnected) card.style.visibility = ''; };
          anim.addEventListener('finish', cleanup);
          anim.addEventListener('cancel', cleanup);
        } else {
          // same place but content changed (e.g. an agent ticked it done) — brief pulse
          const prevSig = lastCardSignatures.get(id);
          if (prevSig !== undefined && newSig !== undefined && prevSig !== newSig) {
            card.classList.remove('just-changed');
            void card.offsetWidth;             // restart the keyframe animation
            card.classList.add('just-changed');
            card.addEventListener('animationend', () => card.classList.remove('just-changed'), { once: true });
          }
        }
      });
      lastCardSignatures = nextSignatures;
    }

    // Expose functions to onclick handlers
    window.openFileModal = openFileModal;
    window.openNewFileModal = openNewFileModal;
    window.openEditModal = openEditModal;
    window.filterMemoryDirectory = filterMemoryDirectory;

    // ===== SERVER MODE: boot the live board automatically =====
    // Served by board-server.mjs → no manual file pickers: auto-load tasks + memory and
    // open the live (SSE) connection. The pickers become "Reload" buttons.
    // board-config.js is a tiny per-board identity companion generated from config.json.
    // Unlike the versioned dashboard bundle it survives app upgrades, and because it is a
    // normal script it works in both localhost and file:// mode.
    function sizeTitle(input) {
      input.style.height = 'auto';
      const height = input.scrollHeight + 2;
      input.style.height = Math.min(height, 132) + 'px';
      input.style.overflowY = height > 132 ? 'auto' : 'hidden';
    }
    for (const input of [tmTitleEl, msTitleEl]) {
      input.addEventListener('input', () => sizeTitle(input));
      input.addEventListener('keydown', event => {
        if (event.key === 'Enter') { event.preventDefault(); input.blur(); }
      });
    }
    window.addEventListener('resize', () => { if (tmTask) sizeTitle(tmTitleEl); if (msTask) sizeTitle(msTitleEl); });

    for (const overlay of [modalOverlay, msModalOverlay]) {
      const dialog = overlay.querySelector('.modal');
      dialog.setAttribute('role', 'dialog'); dialog.setAttribute('aria-modal', 'true');
      dialog.setAttribute('aria-label', overlay === modalOverlay ? 'Edit memory' : 'Milestone details');
      let wasOpen = false, returnFocus = null;
      const focusable = () => [...dialog.querySelectorAll('button,input,textarea,select,a[href],summary')].filter(el => !el.disabled && el.getClientRects().length);
      new MutationObserver(() => {
        const open = overlay.classList.contains('visible');
        if (open === wasOpen) return;
        wasOpen = open; syncPanelModality();
        if (open) { returnFocus = document.activeElement; focusable()[0]?.focus(); }
        else if (returnFocus?.isConnected) returnFocus.focus();
      }).observe(overlay, { attributes: true, attributeFilter: ['class'] });
      overlay.addEventListener('keydown', event => {
        if (event.key !== 'Tab') return;
        const controls = focusable(), first = controls[0], last = controls.at(-1);
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last?.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first?.focus(); }
      });
    }

    applyBoardIdentity(window.SHAUGHV_TASKS_BOARD?.boardTitle, '');
    startFreshnessClock();              // live/seconds/stale badge (both modes)

    if (SERVER_MODE) {
      document.getElementById('boardEmptyState').innerHTML = '<div class="brand-loading"><shaughv-loader aria-hidden="true"></shaughv-loader><span>Loading your workspace…</span></div>';
      openTaskBtn.textContent = 'Reload';
      openMemoryBtn.textContent = 'Reload';
      (async () => {
        // Verify the canonical server root before reading any content. Milestones then load
        // before tasks so task-id backfill sees the full used-id pool.
        if (!await loadBoardIdentityFromServer()) return;
        await loadMilestonesFromServer();
        await loadTasksFromServer(true);
        if (sourceMismatch) return;
        startWatching();
        loadMemoryFromServer();
      })();
    }
  </script>
</body>
</html>
