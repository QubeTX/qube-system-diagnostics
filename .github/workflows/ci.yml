name: CI
on:
  workflow_dispatch:
    inputs:
      resource_seconds:
        type: choice
        options: ["0", "330", "900"]
        default: "0"
permissions:
  contents: read
  actions: read
jobs:
  platform-diagnostic:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, target: linux-gnu-x86_64}
          - {os: macos-15, target: macos-arm64}
          - {os: macos-15-intel, target: macos-x86_64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prepare diagnostic tools
        shell: bash
        run: |
          python -m pip install psutil
          if [[ '${{ runner.os }}' == Linux ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y libgtk-4-1 libxkbcommon0 libx11-6 libwayland-client0 libwayland-cursor0 libwayland-egl1 xvfb dbus-x11 xdotool
          fi
      - name: Download an already measured, unchanged app
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download 35917363148 -n 'sd300-native-gui-${{ matrix.target }}' -D downloaded
          gui=$(find downloaded -type f -name sd300-gui | head -1)
          [[ -n "$gui" && -f "$(dirname "$gui")/sd300" ]]
          chmod +x "$gui" "$(dirname "$gui")/sd300"
          echo "SD300_DIAGNOSTIC_GUI=$PWD/$gui" >> "$GITHUB_ENV"
      - name: Inspect native platform cost separately from acceptance
        shell: bash
        run: |
          set -euo pipefail
          out=target/platform-probes
          revision=9894ad329595c2bcaf14f9af5d8f1dcd6dabb917
          if [[ '${{ runner.os }}' == Linux ]]; then
            GDK_BACKEND=x11 xvfb-run -a dbus-run-session -- python scripts/measure-gui-unix.py "$SD300_DIAGNOSTIC_GUI" --output "$out/cairo-default.json" --revision "$revision" --seconds 90
            GDK_BACKEND=x11 GDK_DEBUG=gl-disable xvfb-run -a dbus-run-session -- python scripts/measure-gui-unix.py "$SD300_DIAGNOSTIC_GUI" --output "$out/cairo-without-gl-diagnostic.json" --revision "$revision" --seconds 90
          else
            NATIVE_SDK_GPU_FRAME_TRACE=1 python scripts/measure-gui-unix.py "$SD300_DIAGNOSTIC_GUI" --output "$out/hidden-frame-trace-diagnostic.json" --revision "$revision" --seconds 90 --hidden --profile-cpu
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sd300-platform-probes-${{ matrix.target }}
          path: target/platform-probes/*.json
          if-no-files-found: error
