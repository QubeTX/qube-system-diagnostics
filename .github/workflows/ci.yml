name: CI
on:
  workflow_dispatch:
    inputs:
      resource_seconds:
        type: choice
        options: ["0", "330", "900"]
        default: "900"
permissions:
  contents: read
  actions: read
jobs:
  candidate-resources:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, target: macos-arm64}
          - {os: macos-15-intel, target: macos-x86_64}
          - {os: ubuntu-22.04, target: linux-gnu-x86_64}
          - {os: ubuntu-22.04-arm, target: linux-gnu-arm64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ec5635d6bf8ed13a96d0405f8a762e245739e459
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prepare native measurement tools
        shell: bash
        run: |
          python -m pip install psutil==7.2.2
          if [[ '${{ runner.os }}' == Linux ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y libgtk-4-1 libxkbcommon0 libx11-6 libwayland-client0 libwayland-cursor0 libwayland-egl1 xvfb dbus-x11 xdotool
          fi
      - name: Download and verify the exact already-built candidate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ $(gh run view 35922389957 --json headSha --jq .headSha) == ec5635d6bf8ed13a96d0405f8a762e245739e459 ]]
          deadline=$((SECONDS + 1200))
          until gh api repos/QubeTX/qube-system-diagnostics/actions/runs/35922389957/artifacts --jq '.artifacts[].name' | grep -Fx 'sd300-native-gui-${{ matrix.target }}'; do
            [[ $SECONDS -lt $deadline ]] || { echo 'Candidate artifact did not arrive within 20 minutes'; exit 1; }
            sleep 20
          done
          gh run download 35922389957 -n 'sd300-native-gui-${{ matrix.target }}' -D downloaded
          gh run download 35922389957 -n 'sd300-gui-resource-smoke-${{ matrix.target }}' -D original-reports
          python scripts/measure-downloaded-candidate.py --target '${{ matrix.target }}' --seconds '${{ inputs.resource_seconds }}'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sd300-candidate-resources-${{ matrix.target }}
          path: target/candidate-resources/*.json
          if-no-files-found: error
