<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TASKS / SHAUGHV</title>
  <script src="./board-config.js"></script>
  <link rel="icon" type="image/svg+xml" href="https://cdn.shaughv.com/brand/shaughv/favicons/SHAUGHV-Favicon-Dark.svg" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/svg+xml" href="https://cdn.shaughv.com/brand/shaughv/favicons/SHAUGHV-Favicon-Light.svg" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://cdn.shaughv.com" crossorigin>
  <!-- SHAUGHV fonts: bundled Makira (reading/action) + Gail Rock (state/metadata). -->
  <link rel="stylesheet" href="./vendor/fonts.css">
  <script defer src="./vendor/animated-brand-mark.js"></script>
  <script defer src="./vendor/shaughv-loader.js"></script>
  <script defer src="./vendor/anime.min.js"></script>
  <script>
    (function () {
      var preference = 'system';
      try { preference = localStorage.getItem('shaughv-tasks-theme') || 'system'; } catch (_) {}
      if (!['light', 'dark', 'system'].includes(preference)) preference = 'system';
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      window.boardAppearance = { preference: preference, media: media, apply: function () {
        document.documentElement.dataset.theme = this.preference === 'system'
          ? (media.matches ? 'dark' : 'light') : this.preference;
      }};
      window.boardAppearance.apply();
    })();
  </script>
  <link rel="stylesheet" href="./dashboard.css">
</head>
<body>
  <a class="skip-link" href="#tasksPanel">Skip to workspace</a>
  <header>
    <div class="header-left">
      <shaughv-mark class="brand-mark" data-icon-only data-static aria-label="SHAUGHV"></shaughv-mark>
      <div class="project-heading">
        <div class="eyebrow">SHAUGHV / workspace</div>
        <h1 id="appTitle" class="app-title">Tasks</h1>
      </div>
    </div>
    <label class="theme-control"><span>Appearance</span>
      <select id="themeToggle" aria-label="Appearance"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select>
    </label>
  </header>
  <nav class="workspace-toolbar" aria-label="Workspace">
    <div class="toolbar-start">
      <div class="view-toggle" id="mainTabToggle">
        <button id="tasksTabBtn" class="active">Tasks</button><button id="memoryTabBtn">Memory</button>
      </div>
      <div class="view-toggle" id="taskViewToggle" aria-label="Task layout">
        <button id="boardViewBtn" class="active">Board</button><button id="listViewBtn">List</button>
      </div>
    </div>
    <div class="toolbar-end buttons">
      <button id="openTaskBtn">Select File</button><button id="openMemoryBtn" style="display:none">Open Folder</button>
      <button id="saveBtn" class="primary" disabled style="display:none">Save</button>
    </div>
  </nav>

  <!-- TASKS TAB PANEL -->
  <main class="tab-panel active" id="tasksPanel" tabindex="-1">
    <div class="milestone-rail" id="milestoneRail" style="display: none;"></div>
    <div class="list-view" id="listView" style="display: none;"></div>
    <div class="board" id="board">
      <div class="empty-state" id="boardEmptyState" style="width: 100%;">
        <shaughv-mark aria-label="SHAUGHV" style="display:block; height: 88px; width: 88px; color: var(--accent); margin: 0 auto 28px;"></shaughv-mark>
        <p style="margin-bottom: 8px; font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.02em; font-size: 20px; color: var(--text-primary);">Your tasks, in focus</p>
        <p style="margin-bottom: 24px; font-size: 15px; color: var(--text-muted);">Select your TASKS.md file to load the board.</p>
        <button id="openBtnLarge">Select TASKS.md</button>
      </div>
    </div>
  </main>

  <!-- MEMORY TAB PANEL -->
  <div class="tab-panel" id="memoryPanel">
    <div id="memoryEmptyState" class="empty-state">
      <shaughv-mark aria-label="SHAUGHV" style="display:block; height: 88px; width: 88px; color: var(--accent); margin: 0 auto 28px;"></shaughv-mark>
      <p style="margin-bottom: 8px; font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.02em; font-size: 20px; color: var(--text-primary);">Workplace memory</p>
      <p style="margin-bottom: 24px; font-size: 15px; color: var(--text-muted);">Select your project folder to browse what I know.</p>
      <button id="openMemoryBtnLarge">Select Folder</button>
    </div>
    <div id="memoryMainContent" style="display: none; flex-direction: column; min-height: 0; flex: 1;">
      <div class="memory-tabs" id="memoryTabsContainer"></div>
      <div class="memory-content-area">
        <div id="memoryContentContainer"></div>
      </div>
    </div>
  </div>

  <!-- MODAL (shared for memory) -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Edit</h3>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer">
        <button id="modalCancel">Cancel</button>
        <button id="modalSave" class="primary">Save</button>
      </div>
    </div>
  </div>

  <!-- TASK MODAL (rich view + edit for a single task: description, notes, subtasks, activity) -->
  <div class="modal-overlay" id="taskModalOverlay">
    <div class="modal task-modal" role="dialog" aria-label="Task details">
      <div class="modal-header">
        <div style="display:flex; align-items:center; gap:12px; flex:1; min-width:0;">
          <button type="button" aria-label="Toggle task completion" class="checkbox" id="tmCheckbox" title="Toggle done" style="flex-shrink:0;"></button>
          <textarea rows="1" class="tm-title-input" id="tmTitle" aria-label="Task title" placeholder="Task title"></textarea>
        </div>
        <div style="display:flex; align-items:center; gap:14px; flex-shrink:0;">
          <span class="tm-id" id="tmId"></span>
          <button class="modal-close" id="tmClose" aria-label="Close task details">&times;</button>
        </div>
      </div>
      <div class="modal-body" id="tmBody"></div>
      <div class="modal-footer">
        <button class="tm-btn" id="tmDelete" style="margin-right:auto; color:var(--danger); border-color:var(--danger);">Delete task</button>
        <button id="tmDoneBtn" class="primary">Close</button>
      </div>
    </div>
  </div>

  <!-- MILESTONE MODAL (rich view + edit for a single milestone: target, description, child tasks, activity) -->
  <div class="modal-overlay" id="msModalOverlay">
    <div class="modal task-modal">
      <div class="modal-header">
        <div style="display:flex; align-items:center; gap:12px; flex:1; min-width:0;">
          <button type="button" aria-label="Toggle milestone completion" class="checkbox" id="msCheckbox" title="Toggle done" style="flex-shrink:0;"></button>
          <textarea rows="1" class="tm-title-input" id="msTitle" aria-label="Milestone title" placeholder="Milestone title"></textarea>
        </div>
        <div style="display:flex; align-items:center; gap:14px; flex-shrink:0;">
          <span class="tm-id" id="msId"></span>
          <button class="modal-close" id="msClose">&times;</button>
        </div>
      </div>
      <div class="modal-body" id="msBody"></div>
      <div class="modal-footer">
        <button class="tm-btn" id="msDelete" style="margin-right:auto; color:var(--danger); border-color:var(--danger);">Delete milestone</button>
        <button id="msDoneBtn" class="primary">Close</button>
      </div>
    </div>
  </div>

  <footer class="workspace-footer"><div id="filePath" class="file-path"></div><span class="footer-label">Tasks / SHAUGHV</span></footer>
  <div class="status-bar" id="status" role="status" aria-live="polite"></div>

  <script>
    // Persist explicit choices; System follows the OS while the board is open.
    (function () {
      const control = document.getElementById('themeToggle');
      const appearance = window.boardAppearance;
      control.value = appearance.preference;
      control.addEventListener('change', () => {
        appearance.preference = control.value;
        try { localStorage.setItem('shaughv-tasks-theme', control.value); } catch (_) {}
        appearance.apply();
      });
      appearance.media.addEventListener('change', () => appearance.apply());
      window.addEventListener('storage', event => {
        if (event.key !== 'shaughv-tasks-theme') return;
        appearance.preference = ['light','dark'].includes(event.newValue) ? event.newValue : 'system';
        control.value = appearance.preference;
        appearance.apply();
      });
    })();

    // ===== SHARED STATE =====
    let activeMainTab = 'tasks'; // 'tasks' or 'memory'

    // When this page is served by board-server.mjs over http(s), we talk to its REST + SSE
    // API and the files live server-side (clean, reliable, auto-loading). When it's opened
    // as a file:// page, we fall back to the File System Access API (the legacy flow with
    // manual "Select TASKS.md" / "Select Folder" pickers + 1s polling). Everything below
    // branches on this one flag.
    const SERVER_MODE = location.protocol === 'http:' || location.protocol === 'https:';

    const statusEl = document.getElementById('status');
    const appTitleEl = document.getElementById('appTitle');
    const filePathEl = document.getElementById('filePath');

    let boardTitle = '';

    function cleanBoardTitle(value) {
      return typeof value === 'string' ? value.trim() : '';
    }

    function compactSourcePath(value) {
      const full = String(value || '');
      if (full.length <= 88) return full;
      const separator = full.includes('\\') ? '\\' : '/';
      const parts = full.split(/[\\/]+/).filter(Boolean);
      if (parts.length <= 6) return full;
      const prefix = /^[A-Za-z]:/.test(parts[0]) ? parts[0] + separator : (full.startsWith('/') ? separator : '');
      return prefix + '…' + separator + parts.slice(-5).join(separator);
    }

    function updateSourceDisplay() {
      filePathEl.classList.toggle('source-mismatch', Boolean(sourceMismatch));
      if (sourceMismatch) {
        filePathEl.textContent = 'Source mismatch — reopen this project board';
        filePathEl.title = sourceMismatch;
        return;
      }
      if (activeMainTab === 'tasks') {
        if (SERVER_MODE && taskFileName) {
          const source = serverTasksPath || (boardRepoName ? boardRepoName + '/.tasks/TASKS.md' : 'TASKS.md');
          filePathEl.textContent = 'Live · ' + compactSourcePath(source);
          filePathEl.title = `Project: ${boardTitle || 'Tasks'}\nTasks source: ${source}\nServer: ${location.origin}`;
        } else if (!SERVER_MODE && taskFileHandle) {
          filePathEl.textContent = 'Selected file · ' + taskFileName;
          filePathEl.title = 'The browser exposes the selected filename, but not its full local path.';
        } else {
          filePathEl.textContent = '';
          filePathEl.title = '';
        }
      } else if (SERVER_MODE && serverRoot) {
        const separator = serverRoot.includes('\\') ? '\\' : '/';
        const source = serverRoot.replace(/[\\/]+$/, '') + separator + 'memory';
        filePathEl.textContent = 'Live · ' + compactSourcePath(source);
        filePathEl.title = `Project: ${boardTitle || 'Tasks'}\nMemory source: ${source}\nServer: ${location.origin}`;
      } else if (memoryDirHandle) {
        filePathEl.textContent = 'Selected folder · ' + memoryDirHandle.name;
        filePathEl.title = 'The browser exposes the selected folder name, but not its full local path.';
      } else {
        filePathEl.textContent = '';
        filePathEl.title = '';
      }
    }

    function applyBoardIdentity(configuredTitle, repoName) {
      const title = cleanBoardTitle(configuredTitle) || cleanBoardTitle(repoName) || 'Tasks';
      boardTitle = title;
      appTitleEl.textContent = title;
      document.title = title.toUpperCase() + ' / TASKS / SHAUGHV';
      if (repoName) boardRepoName = repoName;
      updateSourceDisplay();
    }

    function showStatus(msg) {
      statusEl.textContent = msg;
      statusEl.classList.add('visible');
      setTimeout(() => statusEl.classList.remove('visible'), 2000);
    }

    // ===== INLINE LUCIDE ICONS (ISC) — the brand allows Lucide only, never emoji =====
    const ICON_PATHS = {
      'search': '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
      'check': '<path d="M20 6 9 17l-5-5"/>',
      'check-square': '<path d="M21 10.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12.5"/><path d="m9 11 3 3L22 4"/>',
      'lock': '<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
      'chevron-down': '<path d="m6 9 6 6 6-6"/>',
      'target': '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
      'shield-check': '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1 1 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
      'plus': '<path d="M5 12h14"/><path d="M12 5v14"/>',
      'alert-triangle': '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
      'crosshair': '<circle cx="12" cy="12" r="10"/><path d="M22 12h-4"/><path d="M6 12H2"/><path d="M12 6V2"/><path d="M12 22v-4"/>',
    };
    function icon(name, size = 14) {
      const paths = ICON_PATHS[name] || '';
      return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px; flex-shrink:0;">${paths}</svg>`;
    }

    // ===== MAIN TAB SWITCHING =====
    const tasksTabBtn = document.getElementById('tasksTabBtn');
    const memoryTabBtn = document.getElementById('memoryTabBtn');
    const tasksPanel = document.getElementById('tasksPanel');
    const memoryPanel = document.getElementById('memoryPanel');
    const taskViewToggle = document.getElementById('taskViewToggle');
    const openTaskBtn = document.getElementById('openTaskBtn');
    const openMemoryBtn = document.getElementById('openMemoryBtn');
    const saveBtn = document.getElementById('saveBtn');

    async function switchMainTab(tab) {
      if (tab !== 'tasks' && tmTask) { await closeTaskModal(); if (tmTask) return; }
      activeMainTab = tab;

      tasksTabBtn.classList.toggle('active', tab === 'tasks');
      memoryTabBtn.classList.toggle('active', tab === 'memory');

      tasksPanel.classList.toggle('active', tab === 'tasks');
      memoryPanel.classList.toggle('active', tab === 'memory');

      // Show/hide view toggle for tasks
      taskViewToggle.style.display = tab === 'tasks' ? 'flex' : 'none';

      // Show/hide appropriate buttons
      openTaskBtn.style.display = tab === 'tasks' ? 'inline-flex' : 'none';
      openMemoryBtn.style.display = tab === 'memory' ? 'inline-flex' : 'none';
      saveBtn.style.display = tab === 'tasks' ? 'inline-flex' : 'none';

      updateSourceDisplay();
    }

    tasksTabBtn.addEventListener('click', () => switchMainTab('tasks'));
    memoryTabBtn.addEventListener('click', () => switchMainTab('memory'));

    // ============================================================
    // ===== TASKS FUNCTIONALITY =====
    // ============================================================

    let taskFileHandle = null;
    let taskFileName = '';
    let sections = [];
    let tasks = {};
    let hasChanges = false;
    let currentView = 'board';
    let quickAddSection = null;
    let taskBoardReloadDeferred = false;

    const board = document.getElementById('board');
    const listView = document.getElementById('listView');
    const listViewBtn = document.getElementById('listViewBtn');
    const boardViewBtn = document.getElementById('boardViewBtn');

    // Native drag data is deliberately typed. The old implementation treated every drag
    // over a column as a task drag, so a category reorder could show both a vertical category
    // marker and a horizontal task marker. Keep the legacy payloads for installed browsers,
    // but route handlers exclusively through these explicit drag kinds.
    const TASK_DRAG_TYPE = 'application/x-shaughv-task';
    const SECTION_DRAG_TYPE = 'application/x-shaughv-section';
    let activeDrag = null;

    function dragHasType(event, type) {
      return Array.from(event.dataTransfer?.types || []).includes(type);
    }

    function isTaskDrag(event) {
      return activeDrag?.kind === 'task' || dragHasType(event, TASK_DRAG_TYPE);
    }

    function isSectionDrag(event) {
      return activeDrag?.kind === 'section'
        || dragHasType(event, SECTION_DRAG_TYPE)
        || dragHasType(event, 'text/column');
    }

    function dragId(event, kind) {
      if (activeDrag?.kind === kind) return activeDrag.id;
      if (kind === 'section') {
        return event.dataTransfer?.getData(SECTION_DRAG_TYPE)
          || event.dataTransfer?.getData('text/column') || '';
      }
      return event.dataTransfer?.getData(TASK_DRAG_TYPE)
        || event.dataTransfer?.getData('text/plain') || '';
    }

    function clearBoardDragFeedback() {
      board.querySelectorAll('.column-drop-indicator, .drop-indicator').forEach(el => el.remove());
      board.querySelectorAll('.cards.drag-over').forEach(el => el.classList.remove('drag-over'));
    }

    function clearAllDragFeedback() {
      clearBoardDragFeedback();
      document.querySelectorAll('.list-drop-indicator').forEach(el => el.remove());
      document.querySelectorAll('.list-section.drag-over').forEach(el => el.classList.remove('drag-over'));
    }

    function autoScrollNearEdge(container, pointer, axis) {
      const rect = container.getBoundingClientRect();
      const start = axis === 'x' ? rect.left : rect.top;
      const end = axis === 'x' ? rect.right : rect.bottom;
      const threshold = axis === 'x' ? 72 : 48;
      const maxStep = axis === 'x' ? 22 : 16;
      let delta = 0;
      if (pointer < start + threshold) delta = -maxStep * (1 - Math.max(0, pointer - start) / threshold);
      else if (pointer > end - threshold) delta = maxStep * (1 - Math.max(0, end - pointer) / threshold);
      if (!delta) return;
      if (axis === 'x') container.scrollLeft += delta;
      else container.scrollTop += delta;
    }

    // Return the nearest actual boundary between columns. Boundaries on both sides of the
    // dragged column intentionally map to the same no-op position, keeping the marker under
    // the pointer without making the board jump while the drag is still in progress.
    function getSectionDropPosition(clientX, fromId) {
      const columns = [...board.querySelectorAll('.column[data-section-id]')];
      if (!columns.length) return { dropIndex: 0, left: board.scrollLeft + 4 };

      const boardRect = board.getBoundingClientRect();
      const addRect = board.querySelector('[data-add-section]')?.getBoundingClientRect();
      const rects = columns.map(col => col.getBoundingClientRect());
      const points = [Math.max(boardRect.left + 4, rects[0].left - 12)];
      for (let i = 1; i < rects.length; i++) {
        points.push((rects[i - 1].right + rects[i].left) / 2);
      }
      points.push(addRect ? (rects.at(-1).right + addRect.left) / 2 : rects.at(-1).right + 12);

      let boundaryIndex = 0;
      for (let i = 1; i < points.length; i++) {
        if (Math.abs(points[i] - clientX) < Math.abs(points[boundaryIndex] - clientX)) boundaryIndex = i;
      }
      const fromIndex = columns.findIndex(col => col.dataset.sectionId === fromId);
      const dropIndex = boundaryIndex - (fromIndex !== -1 && fromIndex < boundaryIndex ? 1 : 0);
      return {
        dropIndex,
        left: points[boundaryIndex] - boardRect.left + board.scrollLeft,
      };
    }

    function showSectionDropIndicator(position) {
      board.querySelectorAll('.column-drop-indicator').forEach(el => el.remove());
      const indicator = document.createElement('div');
      indicator.className = 'column-drop-indicator';
      indicator.setAttribute('aria-hidden', 'true');
      indicator.style.left = `${position.left}px`;
      board.appendChild(indicator);
    }

    board.addEventListener('dragover', (event) => {
      if (!isSectionDrag(event)) return;
      event.preventDefault();
      event.stopPropagation();
      event.dataTransfer.dropEffect = 'move';
      autoScrollNearEdge(board, event.clientX, 'x');
      showSectionDropIndicator(getSectionDropPosition(event.clientX, dragId(event, 'section')));
    });

    board.addEventListener('dragleave', (event) => {
      if (!isSectionDrag(event)) return;
      const rect = board.getBoundingClientRect();
      if (event.clientX <= rect.left || event.clientX >= rect.right
          || event.clientY <= rect.top || event.clientY >= rect.bottom) {
        board.querySelectorAll('.column-drop-indicator').forEach(el => el.remove());
      }
    });

    board.addEventListener('drop', (event) => {
      if (!isSectionDrag(event)) return;
      event.preventDefault();
      event.stopPropagation();
      const fromId = dragId(event, 'section');
      const { dropIndex } = getSectionDropPosition(event.clientX, fromId);
      activeDrag = null;
      clearAllDragFeedback();
      moveSectionToIndex(fromId, dropIndex);
    });

    function taskSectionId(name) {
      return name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    }

    // ===== Task IDs + prerequisites =====
    // Every task carries a short, stable, random base-36 id (e.g. "a3f") so it can be
    // referenced as a prerequisite by another task. A task is "blocked" while any of its
    // prerequisites is not yet done.
    function genTaskId(used) {
      let id;
      do { id = (Math.random().toString(36) + '000').slice(2, 5); } while (!id || used.has(id));
      used.add(id);
      return id;
    }
    function currentTaskIds() {
      const s = new Set();
      for (const sec of sections) for (const t of (tasks[sec.id] || [])) if (t.id) s.add(t.id);
      return s;
    }
    // Ids are unique across BOTH TASKS.md and MILESTONES.md — every mint/backfill draws
    // from this union so a task can never collide with a milestone (or vice versa).
    function usedIds() {
      const s = currentTaskIds();
      for (const m of milestones) if (m.id) s.add(m.id);
      return s;
    }
    function taskById(id) {
      for (const sec of sections) for (const t of (tasks[sec.id] || [])) if (t.id === id) return t;
      return null;
    }
    function unmetNeeds(task) {
      if (!task.needs || !task.needs.length) return [];
      // A prerequisite is "unmet" only if it exists and isn't done. Unknown/dangling ids
      // are treated as satisfied so a card can never get permanently stuck.
      return task.needs.filter(nid => { const t = taskById(nid); return t && !t.checked; });
    }
    function isBlocked(task) { return unmetNeeds(task).length > 0; }
    function openSubtasks(task) { return (task.subtasks || []).filter(st => !st.checked); }

    function parseTaskMarkdown(content) {
      const resultSections = [];
      const resultTasks = {};
      let currentSection = null;
      let currentSectionId = null;

      const lines = content.split('\n');
      let currentTask = null;
      let currentSubtask = null;

      for (const line of lines) {
        const headerMatch = line.match(/^## \*{0,2}(.+?)\*{0,2}$/);
        if (headerMatch) {
          if (currentTask && currentSectionId) {
            resultTasks[currentSectionId].push(currentTask);
            currentTask = null;
            currentSubtask = null;
          }

          const sectionName = headerMatch[1].trim();
          currentSectionId = taskSectionId(sectionName);
          currentSection = sectionName;

          if (!resultTasks[currentSectionId]) {
            resultSections.push({ id: currentSectionId, name: sectionName });
            resultTasks[currentSectionId] = [];
          }
        } else if (currentSectionId && line.match(/^- \[[ xX]\]/)) {
          if (currentTask) {
            resultTasks[currentSectionId].push(currentTask);
          }
          const checked = line.match(/\[[xX]\]/) !== null;
          let text = line.replace(/^- \[[ xX]\]\s*/, '');

          // Pull out the parenthesized tokens — "(needs #a3f, #k2p)", "(ms #k7p)",
          // "(owner emmett)" — and the task's own trailing bare id "#a3f" before parsing
          // title/note. Order matters: paren tokens first (needs/ms also contain #ids),
          // then the trailing id, so a paren id is never mistaken for the task's own.
          let needs = [];
          const needsMatch = text.match(/\(needs\s+([^)]*)\)/i);
          if (needsMatch) {
            needs = (needsMatch[1].match(/[0-9a-z]{2,}/gi) || []).map(s => s.toLowerCase());
            text = text.replace(needsMatch[0], '').trim();
          }
          let milestoneId = null;
          const msMatch = text.match(/\(ms\s+#?([0-9a-z]{2,})\)/i);
          if (msMatch) { milestoneId = msMatch[1].toLowerCase(); text = text.replace(msMatch[0], '').trim(); }
          let owner = null;
          const ownerMatch = text.match(/\(owner\s+([^)]+)\)/i);
          if (ownerMatch) { owner = ownerMatch[1].trim(); text = text.replace(ownerMatch[0], '').trim(); }
          let id = null;
          const idMatch = text.match(/#([0-9a-z]{2,})\s*$/i);
          if (idMatch) { id = idMatch[1].toLowerCase(); text = text.replace(/\s*#[0-9a-z]{2,}\s*$/i, '').trim(); }

          let title = text;
          let note = '';
          const boldMatch = text.match(/^\*\*(.+?)\*\*(.*)$/);
          if (boldMatch) {
            title = boldMatch[1];
            note = boldMatch[2].replace(/^\s*-\s*/, '').trim();
          }

          currentTask = {
            id,
            needs,
            milestoneId,
            owner,
            title,
            note,
            checked,
            subtasks: [],
            section: currentSectionId
          };
          currentSubtask = null;
        } else if (currentTask && line.match(/^\s+- \[[ xX]\]/)) {
          const checked = line.match(/\[[xX]\]/) !== null;
          const text = line.replace(/^\s+- \[[ xX]\]\s*/, '');
          currentSubtask = { text, checked, description: '' };
          currentTask.subtasks.push(currentSubtask);
        } else if (currentTask && currentSubtask && line.match(/^\s{4,}/)) {
          const descLine = line.replace(/^\s{4,}>?\s?/, '');
          currentSubtask.description = [currentSubtask.description, descLine].filter(Boolean).join('\n');
        }
      }

      if (currentTask && currentSectionId) {
        resultTasks[currentSectionId].push(currentTask);
      }

      // Backfill stable short ids for any task missing one and de-dupe collisions, so
      // every task can be referenced as a prerequisite. Seeded with the milestone ids
      // (milestones load first) so a backfilled task id can't collide across files.
      const used = new Set(milestones.map(m => m.id).filter(Boolean));
      const flat = [];
      for (const sid in resultTasks) for (const t of resultTasks[sid]) flat.push(t);
      for (const t of flat) { if (t.id && !used.has(t.id)) used.add(t.id); else if (t.id) t.id = null; }
      for (const t of flat) { if (!t.id) t.id = genTaskId(used); }

      return { sections: resultSections, tasks: resultTasks };
    }

    function toMarkdown() {
      let md = '# Tasks\n';

      sections.forEach((section, idx) => {
        md += `\n## ${section.name}\n`;
        const sectionTasks = tasks[section.id] || [];
        sectionTasks.forEach(t => {
          const checkbox = t.checked ? '[x]' : '[ ]';
          const note = t.note ? ` - ${t.note}` : '';
          const needs = (t.needs && t.needs.length) ? ` (needs ${t.needs.map(n => '#' + n).join(', ')})` : '';
          const ms = t.milestoneId ? ` (ms #${t.milestoneId})` : '';
          const owner = t.owner ? ` (owner ${t.owner})` : '';
          const idTag = t.id ? ` #${t.id}` : '';
          md += `- ${checkbox} **${t.title}**${note}${needs}${ms}${owner}${idTag}\n`;
          t.subtasks.forEach(st => {
            const stCheckbox = st.checked ? '[x]' : '[ ]';
            md += `  - ${stCheckbox} ${st.text}\n`;
            if (st.description && st.description.trim()) {
              st.description.replace(/\r\n/g, '\n').split('\n').forEach(line => {
                md += `    > ${line}\n`;
              });
            }
          });
        });
      });

      return md.trimEnd() + '\n';
    }

    // ============================================================
    // ===== MILESTONES (MILESTONES.md + milestones/<id>.md) =====
    // ============================================================
    // Milestones are the level above tasks: a dated outcome tasks roll up into via the
    // (ms #id) tag. Progress is DERIVED, never stored — done children (live Completed tasks +
    // lines archived under the milestone detail file's "## Completed") over all children.
    let milestones = [];
    let msDetails = {};                    // id → parsed detail (powers archived counts + the modal)
    let activeMilestoneFilter = null;      // milestone id, or null = show everything
    let lastMilestonesModified = 0;
    let msSaving = false;
    let boardRepoName = '';                // from /api/ping root — disambiguates multi-board tabs
    let serverRoot = '';
    let serverTasksPath = '';
    let serverBoardId = '';
    let sourceMismatch = '';
    const boardClientId = (globalThis.crypto?.randomUUID?.() || Math.random().toString(36).slice(2));

    function serverWriteHeaders(contentType, extra = {}) {
      return {
        ...(contentType ? { 'Content-Type': contentType } : {}),
        ...(serverBoardId ? { 'X-Expected-Board-Id': serverBoardId } : {}),
        'X-Board-Client': boardClientId,
        ...extra,
      };
    }

    function failSourceIdentity(message) {
      sourceMismatch = message || 'The live server no longer matches this board.';
      if (evtSource) { evtSource.close(); evtSource = null; }
      updateSourceDisplay();
      showStatus('Board source mismatch — reopen the correct project board');
    }

    function verifyServerResponse(response) {
      const actual = response.headers.get('X-Board-Id') || '';
      if (serverBoardId && actual !== serverBoardId) {
        failSourceIdentity(`Expected board ${serverBoardId}, but ${location.origin} answered as ${actual || 'an unverified server'}.`);
        throw new Error('board source identity mismatch');
      }
    }

    function parseMilestoneMarkdown(content) {
      const out = [];
      for (const line of (content || '').split('\n')) {
        const m = line.match(/^- \[([ xX])\]\s*(.*)$/);
        if (!m) continue;
        const checked = m[1] !== ' ';
        let text = m[2];
        let target = null, doneDate = null, id = null;
        const tm = text.match(/\(target\s+(\d{4}-\d{2}-\d{2})\)/i);
        if (tm) { target = tm[1]; text = text.replace(tm[0], '').trim(); }
        const dm = text.match(/\(done\s+(\d{4}-\d{2}-\d{2})\)/i);
        if (dm) { doneDate = dm[1]; text = text.replace(dm[0], '').trim(); }
        const im = text.match(/#([0-9a-z]{2,})\s*$/i);
        if (im) { id = im[1].toLowerCase(); text = text.replace(/\s*#[0-9a-z]{2,}\s*$/i, '').trim(); }
        let title = text, note = '';
        const bm = text.match(/^\*\*(.+?)\*\*(.*)$/);
        if (bm) { title = bm[1]; note = bm[2].replace(/^\s*-\s*/, '').trim(); }
        out.push({ id, title, note, target, doneDate, checked });
      }
      // Backfill/de-dupe ids against the union pool (tasks + milestones).
      const used = new Set(currentTaskIds());
      for (const m of out) { if (m.id && !used.has(m.id)) used.add(m.id); else if (m.id) m.id = null; }
      for (const m of out) { if (!m.id) m.id = genTaskId(used); }
      return out;
    }

    function milestonesToMarkdown() {
      let md = '# Milestones\n';
      if (milestones.length) md += '\n';
      milestones.forEach(m => {
        const checkbox = m.checked ? '[x]' : '[ ]';
        const note = m.note ? ` - ${m.note}` : '';
        const target = m.target ? ` (target ${m.target})` : '';
        const done = m.checked && m.doneDate ? ` (done ${m.doneDate})` : '';
        const idTag = m.id ? ` #${m.id}` : '';
        md += `- ${checkbox} **${m.title}**${note}${target}${done}${idTag}\n`;
      });
      return md.trimEnd() + '\n';
    }

    function milestoneById(id) { return milestones.find(m => m.id === id) || null; }
    function milestoneChildren(m) {
      const out = [];
      for (const sec of sections) for (const t of (tasks[sec.id] || [])) if (t.milestoneId === m.id) out.push(t);
      return out;
    }
    function milestoneOpenChildren(m) { return milestoneChildren(m).filter(t => !t.checked); }
    function milestoneArchivedCount(m) {
      const d = msDetails[m.id];
      return d && d.completed ? d.completed.length : 0;
    }
    // Progress counts archived children too — clearing old Completed tasks (which archives
    // them into the milestone's ## Completed) must never move a milestone backward.
    function milestoneProgress(m) {
      const kids = milestoneChildren(m);
      const archived = milestoneArchivedCount(m);
      return { done: kids.filter(t => t.checked).length + archived, total: kids.length + archived };
    }
    // Derived violation states — an agent can hand-edit the files into a checked parent
    // over open subtasks (or a done milestone over open children). Render honestly; never
    // auto-uncheck or "fix" the data.
    function taskInconsistent(t) { return t.checked && openSubtasks(t).length > 0; }
    function milestoneInconsistent(m) { return m.checked && milestoneOpenChildren(m).length > 0; }
    function pad2(n) { return String(n).padStart(2, '0'); }

    // The section arrays filtered by the active milestone filter — the one lens every
    // tasks surface (board, list, counts) renders through.
    function visibleTasks(sectionId) {
      const arr = tasks[sectionId] || [];
      return activeMilestoneFilter ? arr.filter(t => t.milestoneId === activeMilestoneFilter) : arr;
    }

    async function loadMilestonesFromServer() {
      if (!SERVER_MODE) return;
      try {
        const res = await fetch('/api/milestones');
        const content = await res.text();
        lastMilestonesModified = Number(res.headers.get('X-Board-Mtime')) || 0;
        milestones = parseMilestoneMarkdown(content);
        if (activeMilestoneFilter && !milestoneById(activeMilestoneFilter)) activeMilestoneFilter = null;
        await loadMilestoneDetails();
        renderMilestoneRail();
      } catch (e) { showStatus('Milestones load failed: ' + e.message); }
    }
    // Milestone detail files are tiny and there are single-digit milestones — fetching
    // them all keeps archived-progress counting cheap without denormalizing the index.
    async function loadMilestoneDetails() {
      msDetails = {};
      await Promise.all(milestones.map(async (m) => {
        try {
          const r = await fetch('/api/milestone?id=' + encodeURIComponent(m.id));
          msDetails[m.id] = parseDetail(await r.text());
        } catch (_) { msDetails[m.id] = parseDetail(''); }
      }));
    }
    let msChangesWaiting = false;
    async function saveMilestonesToServer() {
      if (!SERVER_MODE) return;
      if (msSaving) { msChangesWaiting = true; return; }
      msChangesWaiting = false;
      let saved = false;
      msSaving = true;
      try {
        const res = await fetch('/api/milestones', {
          method: 'POST',
          headers: serverWriteHeaders('text/markdown', { 'X-Base-Mtime': String(lastMilestonesModified) }),
          body: milestonesToMarkdown(),
        });
        verifyServerResponse(res);
        if (res.status === 409) {
          const latest = await res.text();
          lastMilestonesModified = Number(res.headers.get('X-Board-Mtime')) || lastMilestonesModified;
          milestones = parseMilestoneMarkdown(latest);
          await loadMilestoneDetails();
          renderMilestoneRail();
          renderTasks();
          showStatus('Milestones changed on disk — reloaded. Re-apply your edit.');
          return;
        }
        if (!res.ok) throw new Error('HTTP ' + res.status);
        lastMilestonesModified = Number(res.headers.get('X-Board-Mtime')) || lastMilestonesModified;
        saved = true;
      } catch (e) { showStatus('Milestones save failed: ' + e.message); }
      finally { msSaving = false; if (saved && msChangesWaiting) saveMilestonesToServer(); }
    }
    async function saveMilestoneDetail(id, activityNote) {
      if (!SERVER_MODE) return;
      const d = msDetails[id] || (msDetails[id] = parseDetail(''));
      if (activityNote) d.activity.push(`${nowStamp()} — ${activityNote}`);
      try {
        const res = await fetch('/api/milestone?id=' + encodeURIComponent(id), {
          method: 'POST',
          headers: serverWriteHeaders('text/markdown'),
          body: serializeDetail(d),
        });
        verifyServerResponse(res);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        markBoardUpdated();
        return true;
      } catch (e) { showStatus('Milestone detail save failed: ' + e.message); return false; }
    }
    // A milestone mutation: persist MILESTONES.md + refresh the surfaces it shows on.
    function commitMilestones() {
      saveMilestonesToServer();
      renderMilestoneRail();
      markBoardUpdated();
    }

    // Cards are READ-ONLY surfaces: a click anywhere opens the rich task modal where ALL
    // editing happens (title, note, description, subtasks, prerequisites, done, delete).
    // The card itself only displays state + supports drag-to-move. (A real drag is
    // distinguished from a click so dropping a card never also opens the modal.)
    function createCard(task) {
      const card = document.createElement('div');
      card.className = 'task-card';
      card.draggable = true;
      card.dataset.id = task.id;
      card.dataset.taskId = task.id;
      card.tabIndex = 0;
      card.setAttribute('role', 'button');
      card.setAttribute('aria-label', task.title);
      card.addEventListener('keydown', event => {
        if (event.target === card && ['Enter', ' '].includes(event.key)) { event.preventDefault(); openTaskModal(task); }
      });

      const unmet = unmetNeeds(task);
      const blocked = unmet.length > 0;
      if (blocked) card.style.opacity = '0.6';

      const subDone = task.subtasks.filter(s => s.checked).length;
      const subTotal = task.subtasks.length;

      let html = `
        <div style="display: flex; align-items: flex-start; gap: 10px;">
          <span class="checkbox ${task.checked ? 'checked' : ''}" style="pointer-events: none; flex-shrink: 0; margin-top: 1px;"></span>
          <div class="card-title" style="flex: 1; min-width: 0; ${task.checked ? 'text-decoration: line-through; opacity: 0.55;' : ''}">${escapeHtml(task.title)}</div>
          <span title="task id" style="font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); opacity: 0.75; white-space: nowrap;">#${task.id}</span>
        </div>
      `;

      if (task.note) {
        html += `<div class="card-note" style="margin-left: 26px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${escapeHtml(task.note)}</div>`;
      }

      const metaBits = [];
      if (subTotal) metaBits.push(`<span title="subtasks done" style="display:inline-flex; align-items:center; gap:4px;">${icon('check-square', 12)}${subDone}/${subTotal}</span>`);
      if (blocked) metaBits.push(`<span style="color: var(--accent); display:inline-flex; align-items:center; gap:4px;" title="Blocked until prerequisites are done">${icon('lock', 12)}needs ${unmet.map(id => '#' + id).join(', ')}</span>`);
      if (task.milestoneId) {
        const m = milestoneById(task.milestoneId);
        metaBits.push(`<span class="chip" title="${m ? 'Milestone: ' + escapeHtml(m.title) : 'Unknown milestone #' + escapeHtml(task.milestoneId)}">${icon('target', 11)}<span class="chip-label">${m ? escapeHtml(m.title) : '#' + escapeHtml(task.milestoneId) + '?'}</span></span>`);
      }
      if (task.owner) metaBits.push(`<span class="chip" title="Owner — who's driving this task"><span class="chip-label">${escapeHtml(task.owner)}</span></span>`);
      if (taskInconsistent(task)) metaBits.push(`<span class="chip warn" title="Checked done in the file, but subtasks are still open — finish them or uncheck">${icon('alert-triangle', 11)}<span class="chip-label">checked · ${openSubtasks(task).length} open</span></span>`);
      if (metaBits.length) {
        html += `<div style="margin-left: 26px; margin-top: 6px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--text-muted); font-family: var(--font-mono);">${metaBits.join('')}</div>`;
      }

      card.innerHTML = html;

      // Distinguish a genuine drag from a click: only open the modal if the pointer didn't
      // move far between mousedown and click (a drag sets `dragged`).
      let dragged = false;
      card.addEventListener('dragstart', (e) => {
        dragged = true;
        activeDrag = { kind: 'task', id: task.id };
        card.classList.add('dragging');
        e.dataTransfer.setData(TASK_DRAG_TYPE, task.id);
        e.dataTransfer.setData('text/plain', task.id);
        e.dataTransfer.effectAllowed = 'move';
      });
      card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
        activeDrag = null;
        clearAllDragFeedback();
        setTimeout(() => { dragged = false; }, 60);
      });
      card.addEventListener('click', () => { if (!dragged) openTaskModal(task); });

      return card;
    }

    function startEditingTitle(titleEl, task) {
      const input = document.createElement('input');
      input.type = 'text';
      input.value = task.title;
      input.style.cssText = 'width: 100%; background: var(--bg-card); border: 2px solid var(--accent); border-radius: 6px; padding: 6px 10px; color: var(--text-primary); font-size: 14px; font-family: inherit; outline: none;';

      titleEl.replaceWith(input);
      input.focus();
      input.select();

      let saved = false;
      const saveEdit = () => {
        if (saved) return;
        saved = true;
        const newTitle = input.value.trim();
        if (newTitle && newTitle !== task.title) {
          task.title = newTitle;
          markChanged();
        }
        renderTasks();
      };

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); saveEdit(); }
        else if (e.key === 'Escape') { saved = true; renderTasks(); }
      });
      input.addEventListener('blur', saveEdit);
    }

    function startEditingNote(noteEl, task) {
      const input = document.createElement('input');
      input.type = 'text';
      input.value = task.note || '';
      input.placeholder = 'Add a note...';
      input.style.cssText = 'width: 100%; background: var(--bg-card); border: 2px solid var(--accent); border-radius: 6px; padding: 4px 8px; color: var(--text-primary); font-size: 13px; font-family: inherit; outline: none;';

      noteEl.replaceWith(input);
      input.focus();

      let saved = false;
      const saveEdit = () => {
        if (saved) return;
        saved = true;
        task.note = input.value.trim();
        markChanged();
        renderTasks();
      };

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); saveEdit(); }
        else if (e.key === 'Escape') { saved = true; renderTasks(); }
      });
      input.addEventListener('blur', saveEdit);
    }

    function startEditingSubtask(subtaskEl, task, idx) {
      const input = document.createElement('input');
      input.type = 'text';
      input.value = task.subtasks[idx].text;
      input.style.cssText = 'width: calc(100% - 30px); background: var(--bg-card); border: 2px solid var(--accent); border-radius: 4px; padding: 2px 6px; color: var(--text-primary); font-size: 13px; font-family: inherit; outline: none;';

      subtaskEl.replaceWith(input);
      input.focus();
      input.select();

      let saved = false;
      const saveEdit = () => {
        if (saved) return;
        saved = true;
        const newText = input.value.trim();
        if (newText) { task.subtasks[idx].text = newText; }
        else { task.subtasks.splice(idx, 1); }
        markChanged();
        renderTasks();
      };

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); saveEdit(); }
        else if (e.key === 'Escape') { saved = true; renderTasks(); }
      });
      input.addEventListener('blur', saveEdit);
    }

    function startAddingSubtask(el, task) {
      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = 'New subtask...';
      input.style.cssText = 'width: calc(100% - 10px); background: var(--bg-card); border: 2px solid var(--accent); border-radius: 4px; padding: 2px 6px; color: var(--text-primary); font-size: 13px; font-family: inherit; outline: none;';

      el.replaceWith(input);
      input.focus();

      let saved = false;
      const saveEdit = () => {
        if (saved) return;
        saved = true;
        const text = input.value.trim();
        if (text) { task.subtasks.push({ text, checked: false, description: '' }); markChanged(); }
        renderTasks();
      };

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); saveEdit(); }
        else if (e.key === 'Escape') { saved = true; renderTasks(); }
      });
      input.addEventListener('blur', saveEdit);
    }

    function startEditingColumnTitle(titleEl, colId) {
      const section = sections.find(s => s.id === colId);
      if (!section) return;

      const input = document.createElement('input');
      input.type = 'text';
      input.value = section.name;
      input.style.cssText = 'width: 180px; background: var(--bg-card); border: 2px solid var(--accent); border-radius: 6px; padding: 4px 10px; color: var(--text-primary); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; font-family: inherit; outline: none;';

      titleEl.replaceWith(input);
      input.focus();
      input.select();

      let saved = false;
      const saveEdit = () => {
        if (saved) return;
        saved = true;
        const newName = input.value.trim();
        if (newName && newName !== section.name) {
          const oldId = section.id;
          section.name = newName;
          const newId = taskSectionId(newName);
          if (newId !== oldId) {
            tasks[newId] = tasks[oldId] || [];
            delete tasks[oldId];
            tasks[newId].forEach(t => t.section = newId);
            section.id = newId;
          }
          markChanged();
        }
        renderTasks();
      };

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); saveEdit(); }
        else if (e.key === 'Escape') { saved = true; renderTasks(); }
      });
      input.addEventListener('blur', saveEdit);
    }

    function createColumn(id, title, items) {
      const col = document.createElement('div');
      col.className = 'column'; col.dataset.state = id;
      col.dataset.sectionId = id;
      col.innerHTML = `
        <div class="column-header">
          <span class="column-title" data-section-id="${id}" style="cursor: pointer;">${escapeHtml(title)}</span>
          <span class="count" data-count-for="${id}">${items.length}</span>
        </div>
        <div class="cards" data-column="${id}"></div>
        <div class="add-card">
          <button data-add="${id}">+ Add task</button>
        </div>
      `;

      const header = col.querySelector('.column-header');
      header.draggable = true;
      let columnDragged = false;

      col.querySelector('.column-title').addEventListener('click', (e) => {
        if (!columnDragged) startEditingColumnTitle(e.target, id);
      });

      header.addEventListener('dragstart', (e) => {
        e.stopPropagation();
        columnDragged = true;
        activeDrag = { kind: 'section', id };
        col.classList.add('dragging-column');
        e.dataTransfer.setData(SECTION_DRAG_TYPE, id);
        e.dataTransfer.setData('text/column', id);
        e.dataTransfer.effectAllowed = 'move';
      });

      header.addEventListener('dragend', () => {
        col.classList.remove('dragging-column');
        activeDrag = null;
        clearAllDragFeedback();
        setTimeout(() => { columnDragged = false; }, 60);
      });

      const cardsContainer = col.querySelector('.cards');
      items.forEach(task => { cardsContainer.appendChild(createCard(task)); });

      const getDropPosition = (event, taskId) => {
        const cards = [...cardsContainer.querySelectorAll('.task-card')];
        const containerRect = cardsContainer.getBoundingClientRect();
        if (!cards.length) {
          return { beforeTaskId: null, top: cardsContainer.scrollTop + 8 };
        }

        const rects = cards.map(card => card.getBoundingClientRect());
        const points = [rects[0].top];
        for (let i = 1; i < rects.length; i++) {
          points.push((rects[i - 1].bottom + rects[i].top) / 2);
        }
        points.push(rects.at(-1).bottom + 5);

        let boundaryIndex = 0;
        for (let i = 1; i < points.length; i++) {
          if (Math.abs(points[i] - event.clientY) < Math.abs(points[boundaryIndex] - event.clientY)) boundaryIndex = i;
        }

        const ids = cards.map(card => card.dataset.id);
        const fromIndex = ids.indexOf(taskId);
        const remainingIds = ids.filter(cardId => cardId !== taskId);
        const targetIndex = boundaryIndex - (fromIndex !== -1 && fromIndex < boundaryIndex ? 1 : 0);
        return {
          beforeTaskId: remainingIds[targetIndex] || null,
          top: points[boundaryIndex] - containerRect.top + cardsContainer.scrollTop,
        };
      };

      const showDropIndicator = (position) => {
        board.querySelectorAll('.drop-indicator').forEach(el => el.remove());
        const indicator = document.createElement('div');
        indicator.className = 'drop-indicator';
        indicator.setAttribute('aria-hidden', 'true');
        indicator.style.top = `${position.top}px`;
        cardsContainer.appendChild(indicator);
      };

      col.addEventListener('dragover', (e) => {
        if (!isTaskDrag(e)) return;
        e.preventDefault();
        e.stopPropagation();
        e.dataTransfer.dropEffect = 'move';
        autoScrollNearEdge(cardsContainer, e.clientY, 'y');
        cardsContainer.classList.add('drag-over');
        showDropIndicator(getDropPosition(e, dragId(e, 'task')));
      });

      col.addEventListener('dragleave', (e) => {
        if (!isTaskDrag(e)) return;
        if (!col.contains(e.relatedTarget)) {
          cardsContainer.classList.remove('drag-over');
          col.querySelectorAll('.drop-indicator').forEach(el => el.remove());
        }
      });

      col.addEventListener('drop', (e) => {
        if (!isTaskDrag(e)) return;
        e.preventDefault();
        e.stopPropagation();
        const taskId = dragId(e, 'task');
        const { beforeTaskId } = getDropPosition(e, taskId);
        activeDrag = null;
        clearAllDragFeedback();
        moveTask(taskId, id, beforeTaskId);
      });

      col.querySelector(`[data-add="${id}"]`).addEventListener('click', () => {
        addNewTask(id, col.querySelector('.cards'));
      });

      return col;
    }

    function addNewTask(sectionId, container) {
      const existing = container.querySelector('.new-task-input');
      if (existing) return;

      const input = document.createElement('textarea');
      input.className = 'new-task-input';
      input.placeholder = 'What needs to be done?';
      input.rows = 2;
      container.appendChild(input);
      input.focus();

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          const title = input.value.trim();
          if (title) {
            if (!tasks[sectionId]) tasks[sectionId] = [];
            tasks[sectionId].push({
              id: genTaskId(usedIds()),
              needs: [],
              milestoneId: activeMilestoneFilter || null,   // creating while filtered joins the milestone
              owner: null,
              title,
              note: '',
              checked: false,
              subtasks: [],
              section: sectionId
            });
            markChanged();
            renderTasks();
          } else { input.remove(); }
        } else if (e.key === 'Escape') { input.remove(); }
      });

      input.addEventListener('blur', () => { setTimeout(() => input.remove(), 100); });
    }

    function moveSectionToIndex(fromId, dropIndex) {
      const fromIdx = sections.findIndex(s => s.id === fromId);
      if (fromIdx === -1) return;
      const [section] = sections.splice(fromIdx, 1);
      const newIdx = Math.max(0, Math.min(dropIndex, sections.length));
      sections.splice(newIdx, 0, section);
      if (newIdx === fromIdx) return;
      markChanged();
      renderTasks();
    }

    function isCompletionSection(sectionId) {
      const section = sections.find(candidate => candidate.id === sectionId);
      const normalized = taskSectionId(section?.name || sectionId);
      return normalized === 'done' || normalized === 'completed';
    }

    function moveTask(taskId, toSectionId, beforeTaskId = null) {
      // Locate the task first WITHOUT removing it, so a blocked move can be refused cleanly.
      let task = null, fromSectionId = null, fromIdx = -1;
      for (const section of sections) {
        const sectionTasks = tasks[section.id] || [];
        const idx = sectionTasks.findIndex(t => t.id === taskId);
        if (idx !== -1) { task = sectionTasks[idx]; fromSectionId = section.id; fromIdx = idx; break; }
      }
      if (!task) return;
      if (task.checked) {
        showStatus('Reopen the completed task before moving or reordering it');
        renderTasks();
        return;
      }

      // Gate: a blocked task can't be moved INTO the Active column until its prerequisites
      // are done. (Reordering within a column, or moving elsewhere, is always allowed.)
      if (toSectionId === 'active' && fromSectionId !== toSectionId && isBlocked(task)) {
        const unmet = unmetNeeds(task).map(id => '#' + id).join(', ');
        showStatus(`Blocked — finish ${unmet} before moving this to Active`);
        renderTasks(); // snap the card back
        return;
      }
      if (isCompletionSection(toSectionId) && fromSectionId !== toSectionId) {
        const destinationName = sections.find(section => section.id === toSectionId)?.name || 'Completed';
        const unmet = unmetNeeds(task);
        if (unmet.length) {
          showStatus(`Blocked — finish ${unmet.map(id => '#' + id).join(', ')} before moving this to ${destinationName}`);
          renderTasks(); // snap the card back
          return;
        }
        if (openSubtasks(task).length) {
          showStatus(`Blocked — finish or remove open subtasks before moving this to ${destinationName}`);
          renderTasks(); // snap the card back
          return;
        }
      }

      tasks[fromSectionId].splice(fromIdx, 1);
      task.section = toSectionId;
      if (!tasks[toSectionId]) tasks[toSectionId] = [];
      const dropIndex = beforeTaskId
        ? tasks[toSectionId].findIndex(candidate => candidate.id === beforeTaskId)
        : -1;
      if (dropIndex >= 0) tasks[toSectionId].splice(dropIndex, 0, task);
      else tasks[toSectionId].push(task);
      markChanged();
      renderTasks();
    }

    async function deleteTask(task) {
      if (!SERVER_MODE) {
        denyNudge('Open the live localhost board to delete tasks — static mode cannot atomically remove TASKS.md state and its detail file');
        return false;
      }
      if (isSaving) {
        denyNudge('A board save is still finishing — retry deletion when it settles');
        return false;
      }

      let removed = null;
      for (const section of sections) {
        const sectionTasks = tasks[section.id] || [];
        const idx = sectionTasks.findIndex(t => t.id === task.id);
        if (idx !== -1) {
          removed = { sectionId: section.id, index: idx };
          sectionTasks.splice(idx, 1);
          break;
        }
      }
      if (!removed) return false;

      if (saveTimeout) { clearTimeout(saveTimeout); saveTimeout = null; }
      isSaving = true;
      try {
        const res = await fetch('/api/tasks', {
          method: 'POST',
          headers: serverWriteHeaders('text/markdown', {
            'X-Base-Mtime': String(lastModified),
            'X-Base-Board-Revision': lastBoardRevision,
            'X-Delete-Task-Id': task.id,
          }),
          body: toMarkdown(),
        });
        verifyServerResponse(res);
        if (res.status === 409) {
          tasks[removed.sectionId].splice(
            Math.min(removed.index, tasks[removed.sectionId].length),
            0,
            task
          );
          taskBoardReloadDeferred = true;
          renderTasks();
          showStatus('Board changed before deletion — close the task to reload, then review and retry');
          return false;
        }
        if (!res.ok) throw new Error(`guarded task deletion returned ${res.status}`);
        const result = await res.json().catch(() => ({ ok: true, detailCleanup: true }));
        lastModified = Number(res.headers.get('X-Board-Mtime')) || lastModified;
        lastBoardRevision = res.headers.get('X-Board-Revision') || lastBoardRevision;
        hasChanges = false;
        saveBtn.disabled = true;
        tmDetailPersistence.delete(task.id);
        markBoardUpdated();
        renderTasks();
        showStatus(result.detailCleanup === false
          ? 'Task deleted; an inaccessible detail tombstone was retained outside live task ids'
          : 'Task and its detail file deleted');
        return true;
      } catch (e) {
        tasks[removed.sectionId].splice(
          Math.min(removed.index, tasks[removed.sectionId].length),
          0,
          task
        );
        renderTasks();
        showStatus('Task deletion failed: ' + e.message);
        return false;
      } finally {
        isSaving = false;
        if (hasChanges && !taskBoardReloadDeferred && !saveTimeout) {
          saveTimeout = setTimeout(autoSave, 500);
        }
      }
    }

    let saveTimeout = null;
    let lastModified = 0;
    let lastBoardRevision = '';
    let watchInterval = null;
    let isSaving = false;

    function markChanged() {
      hasChanges = true;
      saveBtn.disabled = false;
      markBoardUpdated();              // any edit resets the freshness clock to "live"
      if (saveTimeout) clearTimeout(saveTimeout);
      saveTimeout = setTimeout(autoSave, 500);
    }

    async function autoSave() {
      if (!hasChanges) return;
      if (SERVER_MODE) { await saveTasksToServer(); return; }
      if (!taskFileHandle || isSaving) return;
      isSaving = true;
      try {
        const writable = await taskFileHandle.createWritable();
        const content = toMarkdown();
        await writable.write(content);
        await writable.close();
        const file = await taskFileHandle.getFile();
        lastModified = file.lastModified;
        hasChanges = false;
        saveBtn.disabled = true;
        showStatus('Saved');
      } catch (e) {
        showStatus('Save failed: ' + e.message);
      }
      isSaving = false;
    }

    // ===== SERVER MODE: live task I/O via board-server.mjs (fetch + SSE) =====
    let evtSource = null;

    async function loadBoardIdentityFromServer() {
      if (!SERVER_MODE) return true;
      let config = {};
      try {
        const res = await fetch('/api/config', { cache: 'no-store' });
        if (res.ok) config = await res.json();
      } catch (_) {}
      try {
        const res = await fetch('/api/ping', { cache: 'no-store' });
        if (!res.ok) throw new Error(`identity request failed (${res.status})`);
        const info = await res.json();
        if (!info || info.ok !== 'shaughv-task-board' || !info.root) {
          throw new Error('server did not identify a board root');
        }
        if (serverBoardId && info.boardId && serverBoardId !== String(info.boardId)) {
          failSourceIdentity(`This tab expected board ${serverBoardId}, but ${location.origin} now serves ${info.boardId}.`);
          return false;
        }

        serverRoot = String(info.root);
        serverBoardId = info.boardId ? String(info.boardId) : '';
        const separator = serverRoot.includes('\\') ? '\\' : '/';
        serverTasksPath = String(info.tasksPath || (serverRoot.replace(/[\\/]+$/, '') + separator + 'TASKS.md'));
        const parts = serverRoot.replace(/[\\/]+$/, '').split(/[\\/]/);
        const repo = parts.length >= 2 ? parts[parts.length - 2] : parts[parts.length - 1];
        sourceMismatch = '';
        applyBoardIdentity(config?.boardTitle, repo);
        return true;
      } catch (error) {
        failSourceIdentity('Could not verify the live task source: ' + error.message);
        return false;
      }
    }

    async function loadTasksFromServer(initial) {
      if (sourceMismatch) return;
      try {
        const res = await fetch('/api/tasks', { cache: 'no-store' });
        verifyServerResponse(res);
        if (!res.ok) throw new Error(`task source returned ${res.status}`);
        const content = await res.text();
        const incomingMtime = Number(res.headers.get('X-Board-Mtime')) || 0;
        const incomingRevision = res.headers.get('X-Board-Revision') || '';
        if (!incomingRevision) throw new Error('task source omitted its concurrency revision');
        const result = parseTaskMarkdown(content);
        if (!applyTaskSnapshot(result)) {
          taskBoardReloadDeferred = true;
          showStatus('Board changed while this task has unsaved detail work — close it to reload');
          return;
        }
        lastModified = incomingMtime;
        lastBoardRevision = incomingRevision;
        taskFileName = 'TASKS.md';
        if (saveTimeout) { clearTimeout(saveTimeout); saveTimeout = null; }
        hasChanges = false;
        saveBtn.disabled = true;
        updateSourceDisplay();
        if (initial) switchTaskView('board'); else renderTasks();
        markBoardUpdated();             // an agent (or reload) just refreshed the board
        showStatus(initial ? 'Live board connected' : 'Reloaded');
      } catch (e) { showStatus('Board load failed: ' + e.message); }
    }

    async function saveTasksToServer() {
      if (isSaving) return;
      isSaving = true;
      try {
        const res = await fetch('/api/tasks', {
          method: 'POST',
          headers: serverWriteHeaders('text/markdown', {
            'X-Base-Mtime': String(lastModified),
            'X-Base-Board-Revision': lastBoardRevision,
          }),
          body: toMarkdown(),
        });
        verifyServerResponse(res);
        if (res.status === 409) {
          // An agent changed TASKS.md under us — reload latest rather than stomp its write.
          const latest = await res.text();
          const incomingMtime = Number(res.headers.get('X-Board-Mtime')) || lastModified;
          const incomingRevision = res.headers.get('X-Board-Revision') || lastBoardRevision;
          const result = parseTaskMarkdown(latest);
          if (!applyTaskSnapshot(result)) {
            taskBoardReloadDeferred = true;
            showStatus('Board changed on disk while this task has unsaved detail work — close it to reload');
            return;
          }
          lastModified = incomingMtime;
          lastBoardRevision = incomingRevision;
          hasChanges = false;
          saveBtn.disabled = true;
          renderTasks();
          showStatus('Board changed on disk — reloaded. Re-apply your edit.');
          return;
        }
        if (!res.ok) throw new Error(`task save returned ${res.status}`);
        lastModified = Number(res.headers.get('X-Board-Mtime')) || lastModified;
        lastBoardRevision = res.headers.get('X-Board-Revision') || lastBoardRevision;
        hasChanges = false;
        saveBtn.disabled = true;
        showStatus('Saved');
      } catch (e) {
        showStatus('Save failed: ' + e.message);
      } finally {
        isSaving = false;
      }
    }

    async function saveVerifiedTaskCompletion(task, detailRevision) {
      if (!SERVER_MODE) {
        denyNudge('Open the live localhost board to complete tasks — static mode cannot atomically bind the checklist revision to TASKS.md');
        return false;
      }
      if (isSaving) {
        denyNudge('A board save is still finishing — retry completion when it settles');
        return false;
      }
      if (!detailRevision || !lastBoardRevision) {
        denyNudge('The durable board or checklist has no revision — close and reopen the task before completing it');
        return false;
      }

      if (saveTimeout) { clearTimeout(saveTimeout); saveTimeout = null; }
      const priorChecked = task.checked;
      task.checked = true;
      const body = toMarkdown();
      task.checked = priorChecked;
      isSaving = true;
      try {
        const res = await fetch('/api/tasks', {
          method: 'POST',
          headers: serverWriteHeaders('text/markdown', {
            'X-Base-Mtime': String(lastModified),
            'X-Base-Board-Revision': lastBoardRevision,
            'X-Completion-Task-Id': task.id,
            'X-Completion-Detail-Revision': detailRevision,
          }),
          body,
        });
        verifyServerResponse(res);
        if (res.status === 409) {
          taskBoardReloadDeferred = true;
          showStatus('TASKS.md changed before completion — close the task to reload, then re-check it');
          return false;
        }
        if (res.status === 412) {
          tmDetailLoaded = false;
          const persistence = detailPersistenceState(task.id);
          persistence.revision = null;
          persistence.baseBody = null;
          persistence.error = new Error('task detail changed before completion');
          denyNudge('The durable checklist changed before completion — close and reopen the task to review it');
          return false;
        }
        if (!res.ok) throw new Error(`completion save returned ${res.status}`);

        task.checked = true;
        lastModified = Number(res.headers.get('X-Board-Mtime')) || lastModified;
        lastBoardRevision = res.headers.get('X-Board-Revision') || lastBoardRevision;
        hasChanges = false;
        saveBtn.disabled = true;
        markBoardUpdated();
        renderTasks();
        if (tmTask === task) tmCheckboxEl.className = 'checkbox checked';
        showStatus('Completed and saved against the verified checklist revision');
        return true;
      } catch (e) {
        showStatus('Completion save failed: ' + e.message);
        return false;
      } finally {
        isSaving = false;
        if (hasChanges && !taskBoardReloadDeferred && !saveTimeout) {
          saveTimeout = setTimeout(autoSave, 500);
        }
      }
    }

    function startServerWatch() {
      if (evtSource) evtSource.close();
      try {
        evtSource = new EventSource('/api/events');
        // Re-check identity on every initial connection/reconnect. A tab left open while its
        // old server stops therefore catches localhost port reuse before the next user action.
        evtSource.addEventListener('open', () => { loadBoardIdentityFromServer(); });
        evtSource.addEventListener('change', (e) => {
          let change = { kind: 'tasks' };
          try { change = JSON.parse(e.data) || change; } catch (_) {}
          if (serverBoardId && change.boardId && String(change.boardId) !== serverBoardId) {
            failSourceIdentity(`This tab expected board ${serverBoardId}, but its live stream now identifies as ${change.boardId}.`);
            return;
          }
          if (change.writer && change.writer === boardClientId) return;
          const kind = change.kind || 'tasks';
          if (kind === 'tasks') {
            if (!hasChanges && !isSaving) {
              if (tmTask) {
                taskBoardReloadDeferred = true;
                showStatus('Board changed outside this tab — close the open task to refresh');
              } else {
                loadTasksFromServer(false);
              }
            }
          } else if (kind === 'milestones') {
            if (msTask || msSaving) { msReloadDeferred = true; showStatus('Milestones changed outside this tab — close the milestone to refresh'); }
            else loadMilestonesFromServer().then(() => renderTasks());
          } else if (kind === 'detail') {
            // A generic detail event does not identify which task changed. Never replace an
            // open modal: Note/Owner/prerequisite fields can hold unblurred browser drafts
            // even when the description is not in edit mode. Completion re-reads and
            // revision-checks its own detail; close/reopen is the explicit refresh boundary.
            if (tmTask) {
              showStatus('Task detail changed outside this tab — close and reopen it to refresh; completion will re-check durable state');
            }
          } else if (kind === 'config') {
            loadBoardIdentityFromServer();
          } else if (kind === 'memory' && activeMainTab === 'memory') {
            loadMemoryFromServer();
          }
        });
      } catch (e) { /* SSE unavailable — board still works, just not live */ }
    }

    async function checkForExternalChanges() {
      if (!taskFileHandle || hasChanges || isSaving || tmTask) return;
      try {
        const file = await taskFileHandle.getFile();
        if (file.lastModified > lastModified) {
          lastModified = file.lastModified;
          const content = await file.text();
          const result = parseTaskMarkdown(content);
          if (!applyTaskSnapshot(result)) return;
          renderTasks();
          markBoardUpdated();
          showStatus('Reloaded');
        }
      } catch (e) { console.log('Watch error:', e); }
    }

    function startWatching() {
      if (SERVER_MODE) { startServerWatch(); return; }
      if (watchInterval) clearInterval(watchInterval);
      watchInterval = setInterval(checkForExternalChanges, 1000);
    }

    function stopWatching() {
      if (watchInterval) { clearInterval(watchInterval); watchInterval = null; }
    }

    function renderTasks() {
      if (currentView === 'board') {
        // FLIP: snapshot card positions BEFORE the DOM is rebuilt, then animate the deltas.
        const prevRects = (board && board.children.length > 0) ? captureCardRects() : null;
        renderBoard();
        playBoardAnimations(prevRects);
        rollCounts(board);
      } else {
        renderList();
        rollCounts(listView);
      }
      // Milestone progress derives from task state — keep the rail in step with the board.
      if (SERVER_MODE) renderMilestoneRail();
      document.querySelectorAll('[data-task-id]').forEach(el => {
        if (tmTask && el.dataset.taskId === tmTask.id) el.setAttribute('aria-current', 'true');
        else el.removeAttribute('aria-current');
      });
    }

    function renderBoard() {
      board.innerHTML = '';
      sections.forEach(section => {
        board.appendChild(createColumn(section.id, section.name, visibleTasks(section.id)));
      });

      const addSectionBtn = document.createElement('button');
      addSectionBtn.className = 'board-add-section';
      addSectionBtn.dataset.addSection = 'true';
      addSectionBtn.type = 'button';
      addSectionBtn.innerHTML = '<span style="color: var(--text-muted); font-size: 14px; font-weight: 500;">+ Add Section</span>';
      addSectionBtn.addEventListener('click', () => startAddingSection(addSectionBtn));
      board.appendChild(addSectionBtn);
    }

    function renderList() {
      listView.innerHTML = '';

      if (!quickAddSection && sections.length > 0) {
        quickAddSection = sections[0].id;
      }

      // Quick add at top
      const quickAdd = document.createElement('div');
      quickAdd.className = 'quick-add';
      quickAdd.style.cssText = 'border-bottom: 2px solid var(--border); margin-bottom: 24px; padding-bottom: 16px;';

      const sectionName = sections.find(s => s.id === quickAddSection)?.name || 'Select section';
      quickAdd.innerHTML = `
        <span class="checkbox" style="opacity: 0.3;"></span>
        <input type="text" class="quick-add-input" placeholder="Add a task..." id="quickAddInput">
        <button class="quick-add-section" id="quickAddSectionBtn" aria-label="Choose column">${escapeHtml(sectionName)}</button>
      `;
      listView.appendChild(quickAdd);

      const quickInput = document.getElementById('quickAddInput');
      const sectionBtn = document.getElementById('quickAddSectionBtn');

      quickInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && quickInput.value.trim()) {
          const title = quickInput.value.trim();
          if (!tasks[quickAddSection]) tasks[quickAddSection] = [];
          tasks[quickAddSection].unshift({
            id: genTaskId(usedIds()),
            needs: [],
            milestoneId: activeMilestoneFilter || null,
            owner: null,
            title,
            note: '',
            checked: false,
            subtasks: [],
            section: quickAddSection
          });
          quickInput.value = '';
          markChanged();
          renderTasks();
          setTimeout(() => document.getElementById('quickAddInput')?.focus(), 10);
        }
      });

      sectionBtn.addEventListener('click', (e) => { showSectionPicker(e.target); });

      // Render each section
      sections.forEach(section => {
        const sectionTasks = visibleTasks(section.id);
        const sectionEl = document.createElement('div');
        sectionEl.className = 'list-section';
        sectionEl.dataset.sectionId = section.id;

        const header = document.createElement('div');
        header.className = 'list-section-header';
        header.innerHTML = `
          <span class="section-title" data-section-id="${section.id}">${escapeHtml(section.name)}</span>
          <span class="count" data-count-for="${section.id}">${sectionTasks.length}</span>
        `;

        header.querySelector('.section-title').addEventListener('click', (e) => {
          startEditingListSectionTitle(e.target, section);
        });

        sectionEl.appendChild(header);

        const tasksContainer = document.createElement('div');
        tasksContainer.className = 'list-tasks-container';
        tasksContainer.dataset.sectionId = section.id;

        sectionTasks.forEach(task => {
          tasksContainer.appendChild(createListItem(task, section));
        });

        sectionEl.appendChild(tasksContainer);

        // Drag-and-drop handlers for section
        const getDropPosition = (e, container) => {
          const items = [...container.querySelectorAll('.list-item:not(.dragging)')];
          let insertBeforeEl = null;
          let dropIndex = items.length;
          for (let i = 0; i < items.length; i++) {
            const rect = items[i].getBoundingClientRect();
            if (e.clientY < rect.top + rect.height / 2) {
              insertBeforeEl = items[i];
              dropIndex = i;
              break;
            }
          }
          return { insertBeforeEl, dropIndex };
        };

        const showDropIndicator = (e) => {
          tasksContainer.querySelectorAll('.list-drop-indicator').forEach(el => el.remove());
          const { insertBeforeEl } = getDropPosition(e, tasksContainer);
          const indicator = document.createElement('div');
          indicator.className = 'list-drop-indicator';
          if (insertBeforeEl) { tasksContainer.insertBefore(indicator, insertBeforeEl); }
          else { tasksContainer.appendChild(indicator); }
        };

        sectionEl.addEventListener('dragover', (e) => {
          if (!isTaskDrag(e)) return;
          e.preventDefault();
          sectionEl.classList.add('drag-over');
          showDropIndicator(e);
        });

        sectionEl.addEventListener('dragleave', (e) => {
          if (!isTaskDrag(e)) return;
          if (!sectionEl.contains(e.relatedTarget)) {
            sectionEl.classList.remove('drag-over');
            tasksContainer.querySelectorAll('.list-drop-indicator').forEach(el => el.remove());
          }
        });

        sectionEl.addEventListener('drop', (e) => {
          if (!isTaskDrag(e)) return;
          e.preventDefault();
          sectionEl.classList.remove('drag-over');
          tasksContainer.querySelectorAll('.list-drop-indicator').forEach(el => el.remove());
          const taskId = dragId(e, 'task');
          if (!taskId) return;
          const { dropIndex } = getDropPosition(e, tasksContainer);
          const beforeTaskId = tasksContainer.querySelectorAll('.list-item:not(.dragging)')[dropIndex]?.dataset.taskId || null;
          activeDrag = null;
          clearAllDragFeedback();
          moveTask(taskId, section.id, beforeTaskId);
        });

        listView.appendChild(sectionEl);
      });

      // Add Section button
      const addSectionBtn = document.createElement('button');
      addSectionBtn.className = 'list-add-section';
      addSectionBtn.textContent = '+ Add Section';
      addSectionBtn.addEventListener('click', () => { startAddingListSection(addSectionBtn); });
      listView.appendChild(addSectionBtn);
    }

    function startEditingListSectionTitle(titleEl, section) {
      const input = document.createElement('input');
      input.type = 'text';
      input.value = section.name;
      input.style.cssText = 'width: 200px; background: var(--bg-card); border: 2px solid var(--accent); border-radius: 6px; padding: 4px 10px; color: var(--text-primary); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; font-family: inherit; outline: none;';

      titleEl.replaceWith(input);
      input.focus();
      input.select();

      let saved = false;
      const saveEdit = () => {
        if (saved) return;
        saved = true;
        const newName = input.value.trim();
        if (newName && newName !== section.name) {
          const oldId = section.id;
          section.name = newName;
          const newId = taskSectionId(newName);

    async function verifyStaticTasksFolder(folderHandle) {
      if (SERVER_MODE) return true;
      if (!folderHandle || !taskFileHandle) return false;
      const folderTaskHandle = await folderHandle.getFileHandle('TASKS.md');
      if (typeof folderTaskHandle.isSameEntry !== 'function') {
