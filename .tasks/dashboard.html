    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function parseMemoryMarkdown(content) {
      const parsed = {
        title: '',
        fields: {},
        sections: {},
        tables: [],
        rawContent: content
      };

      const lines = content.split('\n');
      let currentSection = '_intro';
      parsed.sections[currentSection] = [];

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];

        if (line.match(/^# /)) {
          parsed.title = line.replace(/^# /, '').trim();
          continue;
        }

        if (line.match(/^## /)) {
          currentSection = line.replace(/^## /, '').trim();
          parsed.sections[currentSection] = [];
          continue;
        }

        const kvMatch = line.match(/^\*\*(.+?):\*\*\s*(.*)$/);
        if (kvMatch) {
          parsed.fields[kvMatch[1]] = kvMatch[2];
          continue;
        }

        parsed.sections[currentSection].push(line);
      }

      for (const key in parsed.sections) {
        parsed.sections[key] = parsed.sections[key].join('\n').trim();
      }

      const tableRegex = /\|(.+)\|\n\|[-| ]+\|\n((?:\|.+\|\n?)+)/g;
      let match;
      while ((match = tableRegex.exec(content)) !== null) {
        const headers = match[1].split('|').map(h => h.trim()).filter(h => h);
        const rowLines = match[2].trim().split('\n');
        const rows = rowLines.map(row => row.split('|').map(c => c.trim()).filter(c => c));
        parsed.tables.push({ headers, rows });
      }

      return parsed;
    }

    function getPreview(content, maxLength = 150) {
      let preview = content
        .replace(/^#+ .+$/gm, '')
        .replace(/\*\*(.+?):\*\*.*/g, '')
        .replace(/\|.+\|/g, '')
        .replace(/[-=]{3,}/g, '')
        .trim()
        .substring(0, maxLength);
      if (content.length > maxLength) preview += '...';
      return preview;
    }

    function getDisplayName(filename) {
      return filename
        .replace('.md', '')
        .split(/[-_]/)
        .map(w => w.charAt(0).toUpperCase() + w.slice(1))
        .join(' ');
    }

    async function loadMemoryFromServer() {
      try {
        const tree = await (await fetch('/api/memory/tree')).json();
        memoryData = { claudeMd: null, memoryFiles: [], memoryDirs: {} };
        const fetchFile = async (sp) =>
          (await fetch('/api/memory/file?path=' + encodeURIComponent(sp))).text();

        if (tree.claudeMd) {
          memoryData.claudeMd = { content: await fetchFile('CLAUDE.md'), serverPath: 'CLAUDE.md' };
        }
        for (const name of (tree.files || [])) {
          memoryData.memoryFiles.push({ name, content: await fetchFile('memory/' + name), serverPath: 'memory/' + name });
        }
        for (const [dir, files] of Object.entries(tree.dirs || {})) {
          memoryData.memoryDirs[dir] = [];
          for (const fname of files) {
            const sp = 'memory/' + dir + '/' + fname;
            const content = await fetchFile(sp);
            memoryData.memoryDirs[dir].push({ name: fname, content, serverPath: sp, parsed: parseMemoryMarkdown(content) });
          }
        }

        const hasAny = memoryData.claudeMd || memoryData.memoryFiles.length || Object.keys(memoryData.memoryDirs).length;
        if (!hasAny) return; // nothing yet — leave the empty state until memory exists
        renderMemory();
        memoryEmptyState.style.display = 'none';
        memoryMainContent.style.display = 'flex';
        if (activeMainTab === 'memory') updateSourceDisplay();
      } catch (e) { showStatus('Memory load failed: ' + e.message); }
    }

    async function saveMemoryToServer(serverPath, content) {
      const res = await fetch('/api/memory/file?path=' + encodeURIComponent(serverPath), {
        method: 'POST', headers: serverWriteHeaders('text/markdown'), body: content,
      });
      verifyServerResponse(res);
      if (!res.ok) throw new Error('Memory save returned HTTP ' + res.status);
    }

    async function loadMemoryDirectory() {
      if (SERVER_MODE) { await loadMemoryFromServer(); return; }
      try {
        const selectedDirHandle = await window.showDirectoryPicker();
        const folderVerified = taskFileHandle
          ? await verifyStaticTasksFolder(selectedDirHandle)
          : false;
        memoryDirHandle = selectedDirHandle;
        staticTasksFolderVerified = folderVerified;

        memoryData = { claudeMd: null, memoryFiles: [], memoryDirs: {} };

        try {
          const claudeFileHandle = await memoryDirHandle.getFileHandle('CLAUDE.md');
          const file = await claudeFileHandle.getFile();
          memoryData.claudeMd = { content: await file.text(), fileHandle: claudeFileHandle };
        } catch (e) { console.log('No CLAUDE.md found'); }

        try {
          const memoryDir = await memoryDirHandle.getDirectoryHandle('memory');
          for await (const entry of memoryDir.values()) {
            if (entry.kind === 'file' && entry.name.endsWith('.md')) {
              const file = await entry.getFile();
              memoryData.memoryFiles.push({
                name: entry.name,
                content: await file.text(),
                fileHandle: entry
              });
            } else if (entry.kind === 'directory') {
              memoryData.memoryDirs[entry.name] = [];
              const subDirHandle = entry;
              for await (const subEntry of subDirHandle.values()) {
                if (subEntry.kind === 'file' && subEntry.name.endsWith('.md')) {
                  const file = await subEntry.getFile();
                  const content = await file.text();
                  memoryData.memoryDirs[entry.name].push({
                    name: subEntry.name,
                    content: content,
                    fileHandle: subEntry,
                    dirHandle: subDirHandle,
                    parsed: parseMemoryMarkdown(content)
                  });
                }
              }
            }
          }
        } catch (e) { console.log('No memory/ directory found'); }

        renderMemory();
        memoryEmptyState.style.display = 'none';
        memoryMainContent.style.display = 'flex';
        updateSourceDisplay();
        showStatus('Loaded memory from ' + memoryDirHandle.name);
        if (tmTask && staticTasksFolderVerified) await loadTaskDetailForModal(tmTask);

      } catch (e) {
        if (e.name !== 'AbortError') { showStatus('Error: ' + e.message); }
      }
    }

    function renderMemoryTabs() {
      let html = '';

      if (memoryData.claudeMd) {
        html += `<button class="memory-tab active" data-tab="overview">Overview</button>`;

      for (const file of memoryData.memoryFiles) {

        html += `<button class="memory-tab${!memoryData.claudeMd && memoryData.memoryFiles[0] === file ? ' active' : ''}" data-tab="file-${name}">${name}</button>`;
      }

      for (const dirName of Object.keys(memoryData.memoryDirs).sort()) {
        const files = memoryData.memoryDirs[dirName];
        let count;
        if (dirName === 'context') {
          count = 0;
          for (const file of files) {
            const p = file.parsed;
            count += Object.keys(p.fields).length;
            for (const table of p.tables) {
              count += table.rows.length;
            }
            for (const [sName, sContent] of Object.entries(p.sections)) {
              if (sContent && sName !== '_intro') {
                count += sContent.split('\n').filter(l => l.trim() && !l.trim().startsWith('|')).length;
              }
            }
          }
        } else {
          count = files.length;
        }
        html += `<button class="memory-tab" data-tab="dir-${escapeHtml(dirName)}">${escapeHtml(dirName)} <span class="count">${count}</span></button>`;
      }

      memoryTabsContainer.innerHTML = html;

      memoryTabsContainer.querySelectorAll('.memory-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          memoryTabsContainer.querySelectorAll('.memory-tab').forEach(t => t.classList.remove('active'));

        });

    function renderMemoryOverview() {
      if (!memoryData.claudeMd) return;

      let statsHtml = '<div class="stats">';
      for (const [dirName, files] of Object.entries(memoryData.memoryDirs)) {
        let count;
        if (dirName === 'context') {
          count = 0;
          for (const file of files) {
            const p = file.parsed;
            count += Object.keys(p.fields).length;
            for (const table of p.tables) { count += table.rows.length; }
            for (const [sName, sContent] of Object.entries(p.sections)) {
              if (sContent && sName !== '_intro') {
                count += sContent.split('\n').filter(l => l.trim() && !l.trim().startsWith('|')).length;
              }
            }
          }
        } else {
          count = files.length;
        }
        if (!count) continue;
        statsHtml += `

    function renderMemoryDirectoryFlat(dirName, files) {
      let html = `

        if (fieldEntries.length > 0) {
          html += `<div class="file-card" style="margin-bottom: 16px;"><table class="memory-flat-table"><tbody>`;
          for (const [key, value] of fieldEntries) {
            html += `<tr data-search="${escapeHtml((key + ' ' + value).toLowerCase())}"><td>${escapeHtml(key)}</td><td>${escapeHtml(value)}</td></tr>`;
          }
          html += `</tbody></table></div>`;
        }

        // Render parsed tables (teams, tools, etc.) as proper HTML tables
        for (const table of p.tables) {
          html += `<div class="file-card" style="margin-bottom: 16px;"><table class="memory-flat-table"><thead><tr>`;
          for (const h of table.headers) {
            html += `<th>${escapeHtml(h)}</th>`;
          }
          html += `</tr></thead><tbody>`;
          for (const row of table.rows) {
            const searchData = row.join(' ').toLowerCase();
            html += `<tr data-search="${escapeHtml(searchData)}">`;
            for (const cell of row) {
              html += `<td>${escapeHtml(cell)}</td>`;
            }
            html += `</tr>`;
          }
          html += `</tbody></table></div>`;
        }

        // Render non-table section content as list items
        for (const [sectionName, sectionContent] of Object.entries(p.sections)) {
          if (!sectionContent || sectionName === '_intro') continue;
          const lines = sectionContent.split('\n').filter(l => l.trim() && !l.trim().startsWith('|'));
          if (lines.length === 0) continue;
          html += `<div class="file-card" style="margin-bottom: 16px;"><table class="memory-flat-table"><thead><tr><th colspan="2">${escapeHtml(sectionName)}</th></tr></thead><tbody>`;

            const cleanLine = line.replace(/^[-*]\s*/, '').replace(/\*\*(.+?)\*\*/g, '$1').trim();
            if (!cleanLine) continue;
            html += `<tr data-search="${escapeHtml((sectionName + ' ' + cleanLine).toLowerCase())}"><td colspan="2">${escapeHtml(cleanLine)}</td></tr>`;
          }
          html += `</tbody></table></div>`;
        }
      }

      html += `</div>`;
      memoryContentContainer.innerHTML = html;

    async function saveModal() {
      if (memorySaving) return;
      const type = modalOverlay.dataset.type;
      const content = document.getElementById('editContent').value;
      memorySaving = true;
      document.getElementById('modalSave').disabled = true;
      document.getElementById('modalBody').inert = true;
      try {
        if (type === 'claudeMd') {
          if (SERVER_MODE) {
            await saveMemoryToServer(memoryData.claudeMd.serverPath, content);
          } else {
            const writable = await memoryData.claudeMd.fileHandle.createWritable();
            await writable.write(content);

          }
          memoryData.claudeMd.content = content;
          showStatus('Working memory saved');

        } else if (type === 'memoryFile') {
          const fileName = modalOverlay.dataset.fileName;
          const file = memoryData.memoryFiles.find(f => f.name === fileName);
          if (file) {
            if (SERVER_MODE) {
              await saveMemoryToServer(file.serverPath, content);
            } else {
              const writable = await file.fileHandle.createWritable();
              await writable.write(content);
              await writable.close();
            }
            file.content = content;
            showStatus('Saved ' + fileName);
          }

        } else if (type === 'dirFile') {
          const dirName = modalOverlay.dataset.dirName;
          const fileName = modalOverlay.dataset.fileName;
          const files = memoryData.memoryDirs[dirName];
          const file = files.find(f => f.name === fileName);
          if (file) {
            if (SERVER_MODE) {
              await saveMemoryToServer(file.serverPath, content);
            } else {
              const writable = await file.fileHandle.createWritable();
              await writable.write(content);
              await writable.close();
            }
            file.content = content;
            file.parsed = parseMemoryMarkdown(content);
            showStatus('Saved ' + fileName);
          }

        } else if (type === 'newDirFile') {
          const dirName = modalOverlay.dataset.dirName;
          let fileName = document.getElementById('newFileName').value.trim();
          if (!fileName) { showStatus('Please enter a filename'); return; }
          if (!fileName.endsWith('.md')) fileName += '.md';

          if (SERVER_MODE) {
            const sp = 'memory/' + dirName + '/' + fileName;
            await saveMemoryToServer(sp, content);
            memoryData.memoryDirs[dirName].push({
              name: fileName,
              content: content,
              serverPath: sp,
              parsed: parseMemoryMarkdown(content)
            });
          } else {
            const memoryDir = await memoryDirHandle.getDirectoryHandle('memory');
            const subDir = await memoryDir.getDirectoryHandle(dirName, { create: true });
            const fileHandle = await subDir.getFileHandle(fileName, { create: true });

            const writable = await fileHandle.createWritable();
            await writable.write(content);
            await writable.close();

            memoryData.memoryDirs[dirName].push({
              name: fileName,
              content: content,
              fileHandle: fileHandle,
              dirHandle: subDir,
              parsed: parseMemoryMarkdown(content)
            });
          }

          showStatus('Created ' + fileName);
        }

        modalOverlay.classList.remove('visible');
        renderMemory();

      } catch (e) {
        showStatus('Error saving: ' + e.message);
      } finally {
        memorySaving = false;
        document.getElementById('modalSave').disabled = false;
        document.getElementById('modalBody').inert = false;
      }
    }

    function nowStamp() {
      const d = new Date();
      const p = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }
    function dateStamp() { return nowStamp().slice(0, 10); }

    // The operator's display name — stamped on contract changes and (optionally) activity, so a
    // shared board's record shows who did what. Asked once, kept in localStorage.
    let operatorDialogPending = false;
    function boardDialog(message, input = false) {
      if (operatorDialogPending) return Promise.resolve(input ? null : false);
      operatorDialogPending = true;
      return new Promise(resolve => {
        const dialog = document.createElement('dialog');
        dialog.className = 'app-dialog';
        dialog.setAttribute('aria-label', input ? 'Record decision' : 'Confirm action');
        const heading = document.createElement('h2');
        heading.textContent = input ? 'Record decision' : 'Confirm action';
        const text = document.createElement('p'); text.textContent = message;
        const field = document.createElement('input'); field.setAttribute('aria-label', 'Your response');
        const actions = document.createElement('div'); actions.className = 'app-dialog-actions';
        const cancel = document.createElement('button'); cancel.textContent = 'Cancel';
        const accept = document.createElement('button'); accept.textContent = 'Continue'; accept.className = 'primary';
        actions.append(cancel, accept); dialog.append(heading, text);
        if (input) dialog.append(field);
        dialog.append(actions); document.body.append(dialog);
        let finished = false;
        function finish(accepted) {
          if (finished) return; finished = true;
          const value = accepted ? (input ? field.value : true) : (input ? null : false);
          dialog.close(); dialog.remove(); operatorDialogPending = false; resolve(value);
        }
        cancel.onclick = () => finish(false); accept.onclick = () => finish(true);
        dialog.addEventListener('cancel', event => { event.preventDefault(); finish(false); });
        dialog.addEventListener('keydown', event => {
          event.stopPropagation();
          if (input && event.key === 'Enter') { event.preventDefault(); finish(true); }
        });
        dialog.showModal(); (input ? field : cancel).focus();
      });
    }
    async function operatorName() {
      let n = null;
      try { n = localStorage.getItem('shaughv-tasks-operator'); } catch (_) {}
      if (!n) {
        n = (await boardDialog('Your name (stamped on waivers so the record shows who made the call):', true) || 'operator').trim() || 'operator';
        try { localStorage.setItem('shaughv-tasks-operator', n); } catch (_) {}
      }
      return n;
    }

    async function verificationContractChange(action, itemText) {
      const label = (itemText || 'this verification check').replace(/\s+/g, ' ').trim();
      const authorized = await boardDialog(
        `${action} changes the task's acceptance contract.\n\n` +
        `Continue only if you are authorized to make this decision.`
      );
      if (!authorized) return null;
      const rawReason = await boardDialog(
        `${action}: "${label}"\n\n` +
        'Record why this criterion is being removed, deferred, or made not applicable:', true
      );
      if (rawReason === null) return null;
      const reason = rawReason.replace(/[\r\n()]+/g, ' ').replace(/\s+/g, ' ').trim();
      if (!reason) {
        denyNudge('A recorded reason is required for a verification contract change');
        return null;
      }
      const who = (await operatorName()).replace(/[\r\n()]+/g, ' ').replace(/\s+/g, ' ').trim() || 'operator';
      return { who, reason };
    }

    function hasAuditableWaiver(v) {
      return v.state !== 'waived'
        || /^\d{4}-\d{2}-\d{2}\s+[—-]\s+[^:]+:\s+\S/.test(v.waived || '');
    }

    // ===== Section-aware detail parse/serialize =====
    // A detail file = a TT;DR-led markdown description, then ordered "## " sections. The
    // board gives special treatment to "## Verification" (three-state checklist:
    // [ ] open / [x] passed / [~] waived, with a "(waived <stamp>)" tail), "## Activity"
    // (log lines), and — in milestone files — "## Completed" (archived child tasks). Every
    // OTHER section is preserved verbatim in its original position, so a round-trip can
    // never drop content the board doesn't understand (## Why, ## Plan, ## Status, …).
    function parseDetail(text) {
      const lines = (text || '').match(/[^\r\n]*(?:\r\n|\n|$)/g)?.filter(Boolean) || [];
      const blocks = [];
      const desc = [];
      let cur = null;
      let fence = null;
      for (const rawLine of lines) {
        const line = rawLine.replace(/\r?\n$/, '');
        const delimiter = line.match(/^\s*(`{3,}|~{3,})/);
        const h = !fence && !delimiter ? line.match(/^##\s+(.+?)\s*$/) : null;
        if (delimiter) {
          if (!fence) fence = delimiter[1];
          else if (delimiter[1][0] === fence[0] && delimiter[1].length >= fence.length) fence = null;
        }
        if (h) {
          const name = h[1];
          const lower = name.toLowerCase();
          const kind = lower === 'verification' ? 'verification'
            : lower === 'activity' ? 'activity'
            : lower === 'completed' ? 'completed' : 'other';
          cur = { kind, name, lines: [], raw: rawLine };
          blocks.push(cur);
        } else if (cur) { cur.lines.push(line); cur.raw += rawLine; }
        else desc.push(line);
      }
      const verification = [];
      const activity = [];
      const completed = [];
      for (const b of blocks) {
        if (b.kind === 'verification') {
          for (const l of b.lines) {
            const m = l.match(/^-\s+\[([ xX~])\]\s*(.*)$/);
            if (!m) continue;
            const state = m[1] === '~' ? 'waived' : (m[1] === ' ' ? 'open' : 'passed');
            let t = m[2];
            let waived = null;
            const wm = t.match(/\(waived\s+([^)]*)\)\s*$/i);
            if (wm) { waived = wm[1].trim(); t = t.slice(0, wm.index).trim(); }
            verification.push({ text: t, state, waived });
          }
        } else if (b.kind === 'activity') {
          for (const l of b.lines) { const t = l.trim(); if (t.startsWith('- ')) activity.push(t.replace(/^-\s+/, '')); }
        } else if (b.kind === 'completed') {
          for (const l of b.lines) { const t = l.trim(); if (t.startsWith('- ')) completed.push(t.replace(/^-\s+/, '')); }
        }
      }
      return { description: desc.join('\n').trim(), verification, activity, completed, blocks };
    }
    function serializeDetail(d) {
      const vLines = (d.verification || []).map(v => {
        const box = v.state === 'waived' ? '[~]' : v.state === 'passed' ? '[x]' : '[ ]';
        const w = v.state === 'waived' && v.waived ? ` (waived ${v.waived})` : '';
        return `- ${box} ${v.text}${w}`;
      });
      const aLines = (d.activity || []).map(a => '- ' + a);
      const cLines = (d.completed || []).map(c => '- ' + c);
      // Start from the original block order; swap in the edited special sections, drop the
      // special sections that emptied, keep everything else verbatim. A file that never had
      // a ## Verification never GAINS an empty one — old files stay byte-stable.
      const blocks = (d.blocks || []).map(b => ({ kind: b.kind, name: b.name, lines: [...b.lines], raw: b.raw }))
        .filter(b => !(b.kind === 'verification' && !vLines.length))
        .filter(b => !(b.kind === 'activity' && !aLines.length))
        .filter(b => !(b.kind === 'completed' && !cLines.length));
      const setBody = (kind, lines) => { const b = blocks.find(x => x.kind === kind); if (b) b.lines = lines; return !!b; };
      const hasV = setBody('verification', vLines);
      const hasC = setBody('completed', cLines);
      const hasA = setBody('activity', aLines);
      if (!hasV && vLines.length) {
        const ai = blocks.findIndex(b => b.kind === 'activity');
        const nb = { kind: 'verification', name: 'Verification', lines: vLines };
        if (ai >= 0) blocks.splice(ai, 0, nb); else blocks.push(nb);
      }
      if (!hasC && cLines.length) {
        const ai = blocks.findIndex(b => b.kind === 'activity');
        const nb = { kind: 'completed', name: 'Completed', lines: cLines };
        if (ai >= 0) blocks.splice(ai, 0, nb); else blocks.push(nb);
      }
      if (!hasA && aLines.length) blocks.push({ kind: 'activity', name: 'Activity', lines: aLines });
      const parts = [];
      const descText = (d.description || '').trim();
      if (descText) parts.push(descText);
      for (const b of blocks) {
        if (b.kind === 'other' && typeof b.raw === 'string') { parts.push(b.raw); continue; }
        const body = [...b.lines];
        while (body.length && !body[body.length - 1].trim()) body.pop();
        while (body.length && !body[0].trim()) body.shift();
        parts.push('## ' + b.name + (body.length ? '\n' + body.join('\n') : ''));
      }
      let output = '';
      for (const part of parts) {
        if (output && !/(?:\r?\n){2}$/.test(output)) output += /\r?\n$/.test(output) ? '\n' : '\n\n';
        output += part;
      }
      return output.endsWith('\n') ? output : output + '\n';
    }

    // Minimal, dependency-free markdown → HTML for the description pane: TT;DR callout,
    // #/##/### headings, -, * and 1. lists, **bold**, _italic_, `code`, ```fences```,
    // [links](url). Everything is escaped before any tag is introduced.
    function renderTaskMarkdown(md) {
      if (!md || !md.trim()) {
        return '<p style="color: var(--text-muted); font-style: italic;">No description yet. Click <strong>Edit</strong> to add a plan — lead with a one-glance <code>TT;DR:</code> summary.</p>';
      }
      const esc = escapeHtml;
      const inline = (text) => {
        const pattern = /`([^`]+)`|\[([^\]]+)\]\(([^)\s]+)\)|\*\*([^*]+)\*\*|\*([^*\n]+)\*|_([^_\n]+)_/g;
        let html = '', last = 0;
        for (const match of text.matchAll(pattern)) {
          html += esc(text.slice(last, match.index));
          if (match[1]) html += '<code>' + esc(match[1]) + '</code>';
          else if (match[2]) {
            const url = match[3];
            const safe = /^(https?:|mailto:)/i.test(url) && !/[\x00-\x20\x7f]/.test(url);
            html += safe ? '<a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(match[2]) + '</a>' : esc(match[0]);
          } else if (match[4]) html += '<strong>' + esc(match[4]) + '</strong>';
          else html += '<em>' + esc(match[5] || match[6]) + '</em>';
          last = match.index + match[0].length;
        }
        return html + esc(text.slice(last));
      };
      const lines = md.replace(/\r\n/g, '\n').split('\n');
      let html = '', inList = false, listTag = 'ul', inCode = false, code = '';
      const closeList = () => { if (inList) { html += `</${listTag}>`; inList = false; } };
      for (let lineIndex = 0; lineIndex < lines.length; lineIndex++) {
        const raw = lines[lineIndex];
        if (!inCode && raw.trim().startsWith('|') && /^\s*\|?\s*:?-{3,}/.test(lines[lineIndex + 1] || '')) {
          closeList();
          const cells = row => row.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(cell => cell.trim());
          html += '<div class="table-scroll"><table><thead><tr>' + cells(raw).map(cell => '<th>' + inline(cell) + '</th>').join('') + '</tr></thead><tbody>';
          lineIndex += 2;
          while (lineIndex < lines.length && lines[lineIndex].trim().startsWith('|')) {
            html += '<tr>' + cells(lines[lineIndex]).map(cell => '<td>' + inline(cell) + '</td>').join('') + '</tr>';
            lineIndex++;
          }
          lineIndex--;
          html += '</tbody></table></div>';
          continue;
        }
        if (/^\s*```/.test(raw)) {
          if (inCode) { html += `<pre><code>${esc(code)}</code></pre>`; inCode = false; code = ''; }
          else { closeList(); inCode = true; code = ''; }
          continue;
        }
        if (inCode) { code += raw + '\n'; continue; }
        const ttdr = raw.match(/^\s*TT;DR:\s*(.*)$/i);
        if (ttdr) { closeList(); html += `<div class="tm-ttdr"><strong>TT;DR:</strong> ${inline(ttdr[1])}</div>`; continue; }
        let m;
        if (m = raw.match(/^###\s+(.*)$/)) { closeList(); html += `<h4>${inline(m[1])}</h4>`; }
        else if (m = raw.match(/^##\s+(.*)$/)) { closeList(); html += `<h3>${inline(m[1])}</h3>`; }
        else if (m = raw.match(/^#\s+(.*)$/)) { closeList(); html += `<h2>${inline(m[1])}</h2>`; }
        else if (m = raw.match(/^\s*[-*]\s+(.*)$/)) {
          if (!inList || listTag !== 'ul') { closeList(); html += '<ul>'; inList = true; listTag = 'ul'; }
          html += `<li>${inline(m[1])}</li>`;
        } else if (m = raw.match(/^\s*\d+\.\s+(.*)$/)) {
          if (!inList || listTag !== 'ol') { closeList(); html += '<ol>'; inList = true; listTag = 'ol'; }
          html += `<li>${inline(m[1])}</li>`;
        } else if (/^\s*$/.test(raw)) { closeList(); }
        else { closeList(); html += `<p>${inline(raw)}</p>`; }
      }
      if (inCode) html += `<pre><code>${esc(code)}</code></pre>`;
      closeList();
      return html;
    }

    async function readStaticTaskDetailBody(taskId) {
      if (!memoryDirHandle || !staticTasksFolderVerified) {
        throw new Error('Select the matching .tasks folder before loading task details');
      }
      try {
        const tasksDir = await memoryDirHandle.getDirectoryHandle('tasks');
        const detailHandle = await tasksDir.getFileHandle(taskId + '.md');
        return await (await detailHandle.getFile()).text();
      } catch (e) {
        if (e.name === 'NotFoundError') return '';
        throw e;
      }
    }

    function applyTaskSnapshot(result) {
      const openId = tmTask && tmTask.id;
      let replacement = null;
      if (openId) {
        if (tmDescEditing && tmDescDirty
            || tmDetailMutationPending || tmCompletionPending || tmDeletionPending) {
          return false;
        }
        for (const section of result.sections) {
          replacement = (result.tasks[section.id] || []).find(t => t.id === openId) || null;
          if (replacement) break;
        }
      }

      sections = result.sections;
      tasks = result.tasks;
      taskBoardReloadDeferred = false;

      if (openId && replacement) {
        // Every modal handler closes over the task object current at render time. Rebind and
        // rerender after a board snapshot replacement so no handler mutates a detached object.
        tmTask = replacement;
        tmTitleEl.value = replacement.title;
        tmIdEl.textContent = '#' + replacement.id;
        tmCheckboxEl.className = 'checkbox ' + (replacement.checked ? 'checked' : '');
        renderTaskModalBody();
      } else if (openId && !replacement) {
        tmDetailMutationEpoch += 1;
        tmDetailLoadEpoch += 1;
        tmCompletionEpoch += 1;
        hideTaskPanel();
        tmTask = null;
        tmDescEditing = false;
        tmDescDirty = false;
        showStatus('The open task was removed outside this tab; the modal was closed');
      }
      return true;
    }

    async function readTaskDetail(taskId) {
      if (SERVER_MODE) {
        const res = await fetch('/api/task?id=' + encodeURIComponent(taskId), { cache: 'no-store' });
        verifyServerResponse(res);
        if (!res.ok) throw new Error(`task detail source returned ${res.status}`);
        const body = await res.text();
        const revision = res.headers.get('X-Detail-Revision');
        if (!revision) throw new Error('task detail source omitted its concurrency revision');
        return { body, revision };
      }
      return { body: await readStaticTaskDetailBody(taskId), revision: null };
    }

    async function writeTaskDetail(taskId, body, baseRevision, baseBody) {
      if (SERVER_MODE) {
        if (!baseRevision) throw new Error('task detail has no base revision; reload before saving');
        const res = await fetch('/api/task?id=' + encodeURIComponent(taskId), {
          method: 'POST',
          headers: serverWriteHeaders('text/markdown', { 'X-Base-Revision': baseRevision }),
          body,
        });
        verifyServerResponse(res);
        if (res.status === 409) {
          const error = new Error('task detail changed outside this tab; stale save refused');
          error.code = 'DETAIL_CONFLICT';
          error.latest = {
            body: await res.text(),
            revision: res.headers.get('X-Detail-Revision'),
          };
          throw error;
        }
        if (res.status === 423) {
          const error = new Error('task was completed before this detail edit could be saved');
          error.code = 'TASK_COMPLETED';
          throw error;
        }
        if (!res.ok) throw new Error(`task detail save returned ${res.status}`);
        const revision = res.headers.get('X-Detail-Revision');
        if (!revision) throw new Error('task detail save omitted its concurrency revision');
        markBoardUpdated();
        return { body, revision };
      }
      if (!memoryDirHandle || !staticTasksFolderVerified) {
        throw new Error('Select the matching .tasks folder before saving task details');
      }
      if (baseBody === null || baseBody === undefined) {
        throw new Error('task detail has no loaded base; reload before saving');
      }
      // File System Access has no atomic compare-and-swap. Compare exact durable bytes
      // immediately before the whole-file write and fail closed on any detected external edit.
      const currentBody = await readStaticTaskDetailBody(taskId);
      if (currentBody !== baseBody) {
        const error = new Error('task detail changed outside this tab; stale save refused');
        error.code = 'DETAIL_CONFLICT';
        error.latest = { body: currentBody, revision: null };
        throw error;
      }
      const tasksDir = await memoryDirHandle.getDirectoryHandle('tasks', { create: true });
      const detailHandle = await tasksDir.getFileHandle(taskId + '.md', { create: true });
      const writable = await detailHandle.createWritable();
      await writable.write(body);
      await writable.close();
      return { body, revision: null };
    }

    async function loadTaskDetailForModal(task) {
      const taskId = task.id;
      const loadEpoch = ++tmDetailLoadEpoch;
      tmDetailLoaded = false;
      if (tmTask === task) renderTaskModalBody();
      try {
        const source = await readTaskDetail(taskId);
        const loaded = parseDetail(source.body);
        if (tmTask !== task || loadEpoch !== tmDetailLoadEpoch) return false;
        tmDetail = loaded;
        tmDetailLoaded = true;
        const persistence = detailPersistenceState(taskId);
        if (persistence.pending === 0) {
          persistence.revision = source.revision;
          persistence.baseBody = source.body;
          persistence.error = null;
        }
        renderTaskModalBody();
        return true;
      } catch (e) {
        if (tmTask === task && loadEpoch === tmDetailLoadEpoch) {
          tmDetail = parseDetail('');
          tmDetailLoaded = false;
          renderTaskModalBody();
          showStatus('Task detail load failed: ' + e.message);
        }
        return false;
      }
    }

    let taskPanelReturnFocus = null;
    const taskPanelBreakpoint = window.matchMedia('(max-width: 1199px)');
    function syncPanelModality() {
      const modal = taskPanelBreakpoint.matches && taskModalOverlay.classList.contains('visible');
      const anyModal = modal || [...document.querySelectorAll('.modal-overlay.visible')].some(el => el !== taskModalOverlay);
      taskModalOverlay.querySelector('[role="dialog"]').setAttribute('aria-modal', String(modal));
      document.querySelectorAll('body > header, body > nav, body > .tab-panel, body > main, body > footer').forEach(el => { el.inert = anyModal; });
    }
    taskPanelBreakpoint.addEventListener('change', syncPanelModality);
    function hideTaskPanel() {
      taskModalOverlay.classList.remove('visible');
      document.body.classList.remove('task-panel-open');
      document.querySelectorAll('[data-task-id][aria-current]').forEach(el => el.removeAttribute('aria-current'));
      syncPanelModality();
      if (taskPanelReturnFocus?.isConnected) taskPanelReturnFocus.focus();
    }
    taskModalOverlay.addEventListener('keydown', event => {
      if (event.key !== 'Tab' || !taskPanelBreakpoint.matches) return;
      const controls = [...taskModalOverlay.querySelectorAll('button, input, select, textarea, a[href], summary, [tabindex="0"]')]
        .filter(el => !el.disabled && !el.closest('[inert]') && el.getClientRects().length);
      const first = controls[0], last = controls.at(-1);
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last?.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first?.focus(); }
    });
    async function openTaskModal(task) {
      if (operatorDialogPending) return;
      if (tmTask === task) return;
      if (tmTask) { await closeTaskModal(); if (tmTask) return; }
      taskPanelReturnFocus = document.activeElement;
      tmDetailMutationEpoch += 1;
      tmDetailLoadEpoch += 1;
      tmCompletionEpoch += 1;
      tmTask = task;
      tmDescEditing = false;
      tmDescDirty = false;
      tmDescExpanded = false;
      tmDetailMutationPending = false;
      tmCompletionPending = false;
      tmDeletionPending = false;
      tmDetail = parseDetail('');
      tmDetailLoaded = false;
      tmTitleEl.value = task.title;
      tmIdEl.textContent = '#' + task.id;
      tmCheckboxEl.className = 'checkbox ' + (task.checked ? 'checked' : '');
      taskModalOverlay.classList.add('visible');
      document.body.classList.add('task-panel-open');
      syncPanelModality();
      document.querySelectorAll('[data-task-id]').forEach(el => el.setAttribute('aria-current', String(el.dataset.taskId === task.id)));
      sizeTitle(tmTitleEl);
      document.getElementById('tmClose').focus();
      renderTaskModalBody();
      if (SERVER_MODE || staticTasksFolderVerified) await loadTaskDetailForModal(task);
    }

    async function closeTaskModal() {
      if (operatorDialogPending) return;
      if (tmDetailMutationPending || tmCompletionPending || tmDeletionPending) {
        denyNudge(tmDeletionPending
          ? 'Deletion is committing durable state — keep this task open until it finishes'
          : tmCompletionPending
            ? 'Completion is checking durable state — keep this task open until it finishes'
            : 'A task-detail change is still saving — keep this task open until it finishes');
        return;
      }
      if (tmDescEditing && tmDescDirty && !(await boardDialog('Discard unsaved description edits?'))) return;
      tmDetailMutationEpoch += 1;
      tmDetailLoadEpoch += 1;
      tmCompletionEpoch += 1;
      tmDetailMutationPending = false;
      tmCompletionPending = false;
      tmDeletionPending = false;
      hideTaskPanel();
      tmTask = null;
      tmDescEditing = false;
      tmDescDirty = false;
      if (taskBoardReloadDeferred) {
        if (SERVER_MODE) loadTasksFromServer(false);
        else checkForExternalChanges();
      }
    }

    function detailPersistenceState(taskId) {
      if (!tmDetailPersistence.has(taskId)) {
        tmDetailPersistence.set(taskId, {
          queue: Promise.resolve(true),
          pending: 0,
          error: null,
          revision: null,
          baseBody: null,
        });
      }
      return tmDetailPersistence.get(taskId);
    }

    function queueTaskDetailSave(taskId, detail, activityNote) {
      if (activityNote) detail.activity.push(`${nowStamp()} — ${activityNote}`);
      const body = serializeDetail(detail);
      const state = detailPersistenceState(taskId);
      state.pending += 1;
      const operation = state.queue.then(async () => {
        const persisted = await writeTaskDetail(
          taskId,
          body,
          state.revision,
          state.baseBody
        );
        state.revision = persisted.revision;
        state.baseBody = persisted.body;
        state.error = null;
        return true;
      }).catch((e) => {
        state.error = e;
        if (e.code === 'DETAIL_CONFLICT' || e.code === 'TASK_COMPLETED') {
          if (tmTask && tmTask.id === taskId) tmDetailLoaded = false;
          if (e.code === 'TASK_COMPLETED') {
            taskBoardReloadDeferred = true;
            showStatus('Task completed outside this tab — detail save refused; close and reopen it');
          } else {
            showStatus('Task detail changed outside this tab — save refused; close and reopen the task to reload');
          }
        } else {
          showStatus('Detail save failed: ' + e.message);
        }
        return false;
      }).finally(() => {
        state.pending = Math.max(0, state.pending - 1);
      });
      state.queue = operation;
      return operation;
    }

    // Persist the per-task detail file (description + verification + activity, plus any
    // agent-authored sections carried verbatim) in live or verified static-folder mode.
    async function saveTaskDetail(task, detail, activityNote) {
      if (!task || !detail) return false;
      if (task.checked) {
        denyNudge('Reopen the completed task before changing its detail contract');
        return false;
      }
      if (tmDetailMutationPending || tmCompletionPending) {
        denyNudge(tmCompletionPending
          ? 'Completion is checking the durable task-detail state'
          : 'A task-detail change is still saving');
        return false;
      }
      const taskId = task.id;
      const mutationEpoch = ++tmDetailMutationEpoch;
      tmDetailMutationPending = true;
      try {
        return await queueTaskDetailSave(taskId, detail, activityNote);
      } finally {
        if (mutationEpoch === tmDetailMutationEpoch) tmDetailMutationPending = false;
      }
    }

    async function taskDetailIsPersisted(taskId) {
      const state = detailPersistenceState(taskId);
      const ok = await state.queue;
      return ok && state.pending === 0 && !state.error;
    }

    function verificationSnapshot(detail) {
      return {
        verification: detail.verification.map(v => ({ ...v })),
        activity: [...detail.activity],
      };
    }

    async function persistVerificationMutation(taskId, detail, before, activityNote) {
      if (tmDetailMutationPending || tmCompletionPending) {
        denyNudge(tmCompletionPending
          ? 'Completion is checking the durable verification state'
          : 'A verification change is still saving');
        return false;
      }
      const mutationEpoch = ++tmDetailMutationEpoch;
      tmDetailMutationPending = true;
      if (tmTask && tmTask.id === taskId) {
        renderTmVerification();
        refreshTmCounts();
      }
      const saved = await queueTaskDetailSave(taskId, detail, activityNote);
      if (!saved) {
        detail.verification = before.verification;
        detail.activity = before.activity;
        showStatus('Verification change was not saved and has been restored');
      }
      if (mutationEpoch === tmDetailMutationEpoch) tmDetailMutationPending = false;
      if (tmTask && tmTask.id === taskId) {
        renderTmVerification();
        renderTmActivity();
        refreshTmCounts();
      }
      return saved;
    }

    function renderTaskModalBody() {
      const task = tmTask;
      if (!task) return;
      const contractLocked = task.checked || tmCompletionPending || tmDeletionPending;
      tmTitleEl.disabled = contractLocked;
      tmBodyEl.inert = contractLocked;
      tmBodyEl.style.pointerEvents = contractLocked ? 'none' : '';
      tmBodyEl.style.opacity = contractLocked ? '0.72' : '';
      if (tmCompletionPending || tmDeletionPending) tmBodyEl.setAttribute('aria-busy', 'true');
      else tmBodyEl.removeAttribute('aria-busy');

      const sectionOptions = sections.map(s =>
        `<option value="${s.id}"${s.id === task.section ? ' selected' : ''}>${escapeHtml(s.name)}</option>`).join('');
      const unmet = unmetNeeds(task);
      const blockedLine = unmet.length
        ? `<div class="tm-blocked">${icon('lock', 13)} Blocked — waiting on ${unmet.map(id => {
            const t = taskById(id);
            return '#' + id + (t ? ' (' + escapeHtml(t.title) + ')' : '');
          }).join(', ')}</div>`
        : '';
      const needsStr = (task.needs || []).map(n => '#' + n).join(', ');
      const detailsAvailable = SERVER_MODE || staticTasksFolderVerified;
      const detailsReady = detailsAvailable && tmDetailLoaded;
      const detailsUnavailable = ' <span style="text-transform:none; letter-spacing:0; color:var(--text-muted); font-weight:normal;">— select the matching .tasks folder</span>';
      const detailsLoading = ' <span style="text-transform:none; letter-spacing:0; color:var(--text-muted); font-weight:normal;">— loading durable task detail</span>';
      const msOptions = ['<option value="">None</option>'].concat(milestones.map(m =>
        `<option value="${m.id}"${m.id === task.milestoneId ? ' selected' : ''}>${escapeHtml(m.title)}</option>`)).join('');

      const descriptionDraft = tmDescEditing ? document.querySelector('#tmDescArea textarea')?.value : undefined;
      tmBodyEl.innerHTML = `
        ${task.checked ? `<div class="tm-blocked">${icon('lock', 13)} Reopen this task before changing its contract, subtasks, or durable detail.</div>` : ''}
        <div class="tm-properties">
          <div class="tm-property"><label for="tmSection">Status</label><select id="tmSection" class="tm-note-input">${sectionOptions}</select></div>
          <div class="tm-property"><label for="tmOwner">Owner</label><input id="tmOwner" class="tm-note-input" placeholder="Unassigned" value="${escapeHtml(task.owner || '')}"></div>
          <div class="tm-property wide"><label for="tmNote">Context</label><input id="tmNote" class="tm-note-input" placeholder="One-line context" value="${escapeHtml(task.note || '')}"></div>
          <div class="tm-property"><label for="tmNeeds">Prerequisites</label><input id="tmNeeds" class="tm-note-input" placeholder="#a3f, #k2p" value="${escapeHtml(needsStr)}"></div>
          ${SERVER_MODE ? `<div class="tm-property"><label for="tmMilestone">Milestone</label><select id="tmMilestone" class="tm-note-input">${msOptions}</select></div>` : ''}
        </div>
        ${blockedLine}

        <div class="tm-section-label tm-row-between"><span>Description${detailsAvailable ? (detailsReady ? '' : detailsLoading) : detailsUnavailable}</span>${detailsReady ? `<button class="tm-btn" id="tmDescToggle">${tmDescEditing ? 'Preview' : 'Edit'}</button>` : ''}</div>
        <div id="tmDescArea"></div>
        <div id="tmRecordSections"></div>

        <div class="tm-section-label">${icon('check-square', 12)} Subtasks <span class="tm-count-badge" id="tmSubCount"></span></div>
        <div id="tmSubtasks"></div>

        ${detailsAvailable ? `<div class="tm-section-label">${icon('shield-check', 12)} Verification${detailsReady ? '' : detailsLoading} <span class="tm-count-badge" id="tmVerifyCount"></span></div>
        <div id="tmVerification"></div>` : ''}

        <div class="tm-section-label">Activity</div>
        <ul class="tm-activity" id="tmActivity"></ul>
      `;

      renderTmDesc();
      if (descriptionDraft !== undefined) { const draft = document.querySelector('#tmDescArea textarea'); if (draft) draft.value = descriptionDraft; }
      const records = document.getElementById('tmRecordSections');
      if (detailsReady) for (const block of tmDetail.blocks.filter(block => block.kind === 'other')) {
        const section = document.createElement('details'); section.className = 'task-record-section'; section.open = true;
        const heading = document.createElement('summary'); heading.textContent = block.name;
        const content = document.createElement('div'); content.className = 'tm-desc-rendered';
        content.innerHTML = renderMarkdownToHtml(block.lines.join('\n'));
        section.append(heading, content); records.append(section);
      }
      renderTmSubtasks();
      renderTmVerification();
      renderTmActivity();
      refreshTmCounts();

      const secSel = document.getElementById('tmSection');
      secSel.addEventListener('change', () => {
        const to = secSel.value;
        if (to !== task.section) {
          moveTask(task.id, to);            // honours the Active-block gate; sets task.section on success
          secSel.value = task.section;      // reflect reality (revert if the move was refused)
          tmCheckboxEl.className = 'checkbox ' + (task.checked ? 'checked' : '');
        }
      });

      const noteInput = document.getElementById('tmNote');
      noteInput.addEventListener('change', () => {
        const v = noteInput.value.trim();
        if (v !== (task.note || '')) { task.note = v; commitBoard(); }
      });

      const needsInput = document.getElementById('tmNeeds');
      needsInput.addEventListener('change', () => {
        const ids = [...new Set((needsInput.value.match(/[0-9a-z]{2,}/gi) || [])
          .map(s => s.toLowerCase()).filter(id => id !== task.id))];   // no self-dependency
        if (JSON.stringify(ids) !== JSON.stringify(task.needs || [])) {
          task.needs = ids;
          commitBoard();
          renderTaskModalBody();             // refresh the blocked-line
        }
      });

      const msSel = document.getElementById('tmMilestone');
      if (msSel) msSel.addEventListener('change', () => {
        const v = msSel.value || null;
        if (v !== (task.milestoneId || null)) {
          task.milestoneId = v;
          commitBoard();
        }
      });

      const ownerInput = document.getElementById('tmOwner');
      if (ownerInput) ownerInput.addEventListener('change', () => {
        const v = ownerInput.value.trim() || null;
        if (v !== (task.owner || null)) {
          task.owner = v;
          commitBoard();
        }
      });
    }

    // Zero-padded mono progress readouts for the modal section labels — subtasks and
    // verification get DISTINCT icons + words so the two gates never blur together.
    function refreshTmCounts() {
      if (!tmTask) return;
      const subEl = document.getElementById('tmSubCount');
      if (subEl) {
        const total = (tmTask.subtasks || []).length;
        const done = (tmTask.subtasks || []).filter(s => s.checked).length;
        subEl.innerHTML = total ? `<span class="done">${pad2(done)}</span>/${pad2(total)}` : '';
      }
      const vEl = document.getElementById('tmVerifyCount');
      if (vEl) {
        const list = (tmDetail && tmDetail.verification) || [];
        const settled = list.filter(v => v.state !== 'open').length;
        const waived = list.filter(v => v.state === 'waived').length;
        vEl.innerHTML = list.length
          ? `<span class="done">${pad2(settled)}</span>/${pad2(list.length)}${waived ? ' · ' + waived + ' waived' : ''}`
          : '';
      }
    }

    // Mount a read-only rendered description that collapses when it's tall, with an
    // intuitive Show more/less toggle and a capped, scrollable expanded state. Short
    // descriptions (that fit the collapsed cap) render whole with no control. `state` is
    // a {get,set} pair over the owning modal's expanded flag, so the choice survives the
    // in-modal re-renders and resets to collapsed when the modal reopens.
    function mountCollapsibleDesc(area, markdown, state) {
      const div = document.createElement('div');
      div.className = 'tm-desc-rendered';
      div.innerHTML = renderTaskMarkdown(markdown);
      area.appendChild(div);
      const COLLAPSED_MAX = 200;
      if (div.scrollHeight > COLLAPSED_MAX + 8) {   // only wire the toggle when it truly overflows
        const btn = document.createElement('button');
        btn.className = 'tm-btn tm-desc-more';
        const apply = () => {
          const open = state.get();
          div.classList.toggle('expanded', open);
          div.classList.toggle('collapsed', !open);
          btn.textContent = open ? 'Show less ▴' : 'Show more ▾';
          btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        };
        btn.addEventListener('click', () => { state.set(!state.get()); apply(); });
        area.appendChild(btn);
        apply();
      }
      return div;
    }

    function renderTmDesc() {
      const area = document.getElementById('tmDescArea');
      if (!area) return;
      if (!tmDetailLoaded) {
        area.innerHTML = '<p style="color: var(--text-muted); font-style: italic;">Task detail is loading. Editing stays locked until the durable file has been read.</p>';
        return;
      }
      // The header Edit/Preview toggle only governs entry into edit mode; while editing, the
      // in-area Cancel/Save buttons govern exit, so hide the header toggle to avoid a dead,
      // mislabeled control.
      const toggle = document.getElementById('tmDescToggle');
      if (toggle) toggle.style.display = tmDescEditing ? 'none' : '';
      if (tmDescEditing) {
        area.innerHTML = '';
        const ta = document.createElement('textarea');
        ta.className = 'tm-desc-edit';
        ta.value = tmDetail.description || '';
        ta.placeholder = 'TT;DR: one or two plain-English sentences on what this task is and where it stands.\n\nThen a stable dependency skeleton and short next-action window: predicted observation, oracle, and redirect condition…';
        ta.addEventListener('input', () => { tmDescDirty = true; });
        area.appendChild(ta);
        const actions = document.createElement('div');
        actions.style.cssText = 'display:flex; gap:8px; margin-top:8px; justify-content:flex-end;';
        actions.innerHTML = '<button class="tm-btn" id="tmDescCancel">Cancel</button><button class="tm-btn" id="tmDescSave" style="border-color:var(--accent); color:var(--accent);">Save description</button>';
        area.appendChild(actions);
        ta.focus();
        const cancelButton = document.getElementById('tmDescCancel');
        cancelButton.addEventListener('click', () => {
          tmDescEditing = false; tmDescDirty = false; renderTaskModalBody();
        });
        document.getElementById('tmDescSave').addEventListener('click', async (event) => {
          const saveButton = event.currentTarget;
          saveButton.disabled = true;
          cancelButton.disabled = true;
          const taskAtSave = tmTask;
          const detailAtSave = tmDetail;
          const expectedMutationEpoch = tmDetailMutationEpoch + 1;
          const priorDescription = detailAtSave.description;
          const priorActivity = [...detailAtSave.activity];
          detailAtSave.description = ta.value;
          const saved = await saveTaskDetail(taskAtSave, detailAtSave, 'description edited (operator)');
          const modalStillCurrent = tmTask === taskAtSave
            && tmDetail === detailAtSave
            && tmDetailMutationEpoch === expectedMutationEpoch;
          if (!saved) {
            detailAtSave.description = priorDescription;
            detailAtSave.activity = priorActivity;
            if (modalStillCurrent) {
              tmDescDirty = true;
              saveButton.disabled = false;
              cancelButton.disabled = false;
              showStatus('Description save failed — the draft remains open');
            }
            return;
          }
          if (!modalStillCurrent) return;
          tmDescEditing = false;
          tmDescDirty = false;
          renderTaskModalBody();
          showStatus('Description saved');
        });
      } else {
        area.innerHTML = '';
        mountCollapsibleDesc(area, tmDetail.description, {
          get: () => tmDescExpanded,
          set: (v) => { tmDescExpanded = v; },
        });
        if (toggle) toggle.onclick = () => { tmDescEditing = true; renderTmDesc(); };
      }
    }

    function renderTmSubtasks() {
      const wrap = document.getElementById('tmSubtasks');
      if (!wrap || !tmTask) return;
      wrap.innerHTML = '';
      (tmTask.subtasks || []).forEach((st, idx) => {
        const row = document.createElement('div');
        row.className = 'tm-sub';
        const cb = document.createElement('button');
        cb.type = 'button'; cb.setAttribute('aria-label', 'Toggle check');
        cb.className = 'checkbox ' + (st.checked ? 'checked' : '');
        cb.style.flexShrink = '0';
        cb.addEventListener('click', () => { st.checked = !st.checked; commitBoard(); renderTmSubtasks(); refreshTmCounts(); });
        const txt = document.createElement('input');
        txt.type = 'text';
        txt.className = 'tm-sub-text' + (st.checked ? ' checked' : '');
        txt.value = st.text;
        txt.addEventListener('change', () => {
          const v = txt.value.trim();
          if (!v) { tmTask.subtasks.splice(idx, 1); commitBoard(); renderTmSubtasks(); }
          else if (v !== st.text) { st.text = v; commitBoard(); }
        });
        const del = document.createElement('button');
        del.className = 'tm-sub-del';
        del.title = 'Remove subtask';
        del.textContent = '×';
        del.addEventListener('click', () => { tmTask.subtasks.splice(idx, 1); commitBoard(); renderTmSubtasks(); });
        const desc = document.createElement('textarea');
        desc.className = 'tm-sub-desc';
        desc.placeholder = 'Subtask description or handoff note...';
        desc.value = st.description || '';
        desc.addEventListener('change', () => {
          const v = desc.value.trim();
          if (v !== (st.description || '')) { st.description = v; commitBoard(); }
        });
        row.appendChild(cb); row.appendChild(txt); row.appendChild(del); row.appendChild(desc);
        wrap.appendChild(row);
      });
      const add = document.createElement('button');
      add.className = 'tm-add';
      add.textContent = '+ Add subtask';
      add.addEventListener('click', () => {
        const row = document.createElement('div');
        row.className = 'tm-sub';
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'tm-sub-text';
        input.placeholder = 'New subtask…';
        input.style.gridColumn = '1 / 4';
        let committed = false;
        const commit = () => {
          if (committed) return; committed = true;
          const v = input.value.trim();
          if (v) { if (!tmTask.subtasks) tmTask.subtasks = []; tmTask.subtasks.push({ text: v, checked: false, description: '' }); commitBoard(); }
          renderTmSubtasks();
        };
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); commit(); }
          else if (e.key === 'Escape') { committed = true; renderTmSubtasks(); }
        });
        input.addEventListener('blur', commit);
        row.appendChild(input);
        wrap.insertBefore(row, add);
        input.focus();
      });
      wrap.appendChild(add);
    }

    // ===== Verification checklist (the waivable hard gate on completion) =====
    // Items live in the task DETAIL file's "## Verification" section, never in TASKS.md.
    // Three states: open / passed / waived. Waiving or removing a criterion is an acceptance-
    // contract change, so the dashboard requires an authority acknowledgement and a reason.
    function renderTmVerification() {
      const wrap = document.getElementById('tmVerification');
      if (!wrap || !tmTask || !tmDetail) return;
      wrap.innerHTML = '';
      wrap.style.pointerEvents = tmCompletionPending ? 'none' : '';
      wrap.style.opacity = tmCompletionPending ? '0.65' : '';
      if (!tmDetailLoaded) {
        const hint = document.createElement('div');
        hint.style.cssText = 'font-style: italic; font-size: 13px; color: var(--text-muted); padding: 4px 0;';
        hint.textContent = 'Loading durable verification checks…';
        wrap.appendChild(hint);
        return;
      }
      const list = tmDetail.verification || (tmDetail.verification = []);
      list.forEach((v, idx) => {
        const row = document.createElement('div');
        row.className = 'tm-verify-row' + (v.state === 'passed' ? ' passed' : v.state === 'waived' ? ' waived' : '');
        const cb = document.createElement('button');
        cb.type = 'button'; cb.setAttribute('aria-label', 'Toggle check');
        cb.className = 'checkbox ' + (v.state === 'passed' ? 'checked' : '');
        cb.style.flexShrink = '0';
        if (v.state === 'waived') cb.style.opacity = '0.35';
        cb.title = v.state === 'waived' ? 'Waived — un-waive first to check it' : 'Toggle passed';
        cb.addEventListener('click', async () => {
          if (v.state === 'waived') return;
          if (tmDetailMutationPending || tmCompletionPending) {
            denyNudge(tmCompletionPending
              ? 'Completion is checking the durable verification state'
              : 'A verification change is still saving');
            return;
          }
          const taskId = tmTask.id;
          const detail = tmDetail;
          const before = verificationSnapshot(detail);
          v.state = v.state === 'passed' ? 'open' : 'passed';
          await persistVerificationMutation(
            taskId,
            detail,
            before,
            `${v.state === 'passed' ? 'passed' : 'reopened'} verification criterion "${v.text}"`
          );
        });
        const txt = document.createElement('input');
        txt.type = 'text';
        txt.className = 'tm-verify-text';
        txt.value = v.text;
        txt.addEventListener('change', async () => {
          if (tmDetailMutationPending || tmCompletionPending) {
            txt.value = v.text;
            denyNudge(tmCompletionPending
              ? 'Completion is checking the durable verification state'
              : 'A verification change is still saving');
            return;
          }
          const nv = txt.value.trim();
          if (nv === v.text) return;
          const taskId = tmTask.id;
          const detail = tmDetail;
          const before = verificationSnapshot(detail);
          let activityNote = '';
          if (!nv) {
            const decision = await verificationContractChange('Remove verification criterion', v.text);
            if (!decision) {
              txt.value = v.text;
              return;
            }
            list.splice(idx, 1);
            activityNote = `removed verification criterion "${v.text}" (${decision.who}: ${decision.reason})`;
          } else {
            const oldText = v.text;
            const decision = await verificationContractChange(
              v.state !== 'open'
                ? 'Change settled verification criterion'
                : 'Change verification criterion',
              v.text
            );
            if (!decision) {
              txt.value = v.text;
              return;
            }
            if (v.state !== 'open') {
              v.state = 'open';
              v.waived = null;
              activityNote = `changed settled verification criterion "${oldText}" to "${nv}" and reset it open (${decision.who}: ${decision.reason})`;
            } else {
              activityNote = `changed open verification criterion "${oldText}" to "${nv}" (${decision.who}: ${decision.reason})`;
            }
            v.text = nv;
          }
          await persistVerificationMutation(taskId, detail, before, activityNote);
        });
        const waive = document.createElement('button');
        waive.className = 'tm-waive-btn';
        waive.textContent = v.state === 'waived' ? 'waived' : 'waive';
        waive.title = v.state === 'waived' ? 'Un-waive (back to open)' : 'Waive this check — authorized reason required';
        waive.addEventListener('click', async () => {
          if (tmDetailMutationPending || tmCompletionPending) {
            denyNudge(tmCompletionPending
              ? 'Completion is checking the durable verification state'
              : 'A verification change is still saving');
            return;
          }
          const taskId = tmTask.id;
          const detail = tmDetail;
          const before = verificationSnapshot(detail);
          let activityNote = '';
          if (v.state === 'waived') {
            v.state = 'open';
            v.waived = null;
            activityNote = `un-waived "${v.text}"`;
          } else {
            const decision = await verificationContractChange('Waive verification criterion', v.text);
            if (!decision) return;
            v.state = 'waived';
            v.waived = `${dateStamp()} — ${decision.who}: ${decision.reason}`;
            activityNote = `waived "${v.text}" (${decision.who}: ${decision.reason})`;
          }
          await persistVerificationMutation(taskId, detail, before, activityNote);
        });
        const del = document.createElement('button');
        del.className = 'tm-sub-del';
        del.title = 'Remove check — authorized reason required';
        del.textContent = '×';
        del.addEventListener('click', async () => {
          if (tmDetailMutationPending || tmCompletionPending) {
            denyNudge(tmCompletionPending
              ? 'Completion is checking the durable verification state'
              : 'A verification change is still saving');
            return;
          }
          const decision = await verificationContractChange('Remove verification criterion', v.text);
          if (!decision) return;
          const taskId = tmTask.id;
          const detail = tmDetail;
          const before = verificationSnapshot(detail);
          list.splice(idx, 1);
          await persistVerificationMutation(
            taskId,
            detail,
            before,
            `removed verification criterion "${v.text}" (${decision.who}: ${decision.reason})`
          );
        });
        row.appendChild(cb); row.appendChild(txt); row.appendChild(waive); row.appendChild(del);
        if (v.state === 'waived' && v.waived) {
          const stamp = document.createElement('div');
          stamp.className = 'tm-waive-stamp';
          stamp.textContent = 'waived ' + v.waived;
          row.appendChild(stamp);
        }
        wrap.appendChild(row);
      });
      if (!list.length) {
        const hint = document.createElement('div');
        hint.style.cssText = 'font-style: italic; font-size: 13px; color: var(--text-muted); padding: 4px 0;';
        hint.textContent = tmDetailLoaded
          ? 'Add the concrete pass/fail checks that gate this task — completion requires every check passed or waived.'
          : 'Loading checks…';
        wrap.appendChild(hint);
      }
      const add = document.createElement('button');
      add.className = 'tm-add';
      add.textContent = '+ Add criterion';
      add.addEventListener('click', () => {
        const row = document.createElement('div');
        row.className = 'tm-verify-row';
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'tm-verify-text';
        input.placeholder = 'Concrete, observable pass/fail check…';
        input.style.gridColumn = '1 / 5';
        let committed = false;
        const commit = async () => {
          if (committed) return; committed = true;
          const v = input.value.trim();
          if (!v) {
            renderTmVerification();
            refreshTmCounts();
            return;
          }
          if (tmDetailMutationPending || tmCompletionPending) {
            denyNudge(tmCompletionPending
              ? 'Completion is checking the durable verification state'
              : 'A verification change is still saving');
            renderTmVerification();
            return;
          }
          const taskId = tmTask.id;
          const detail = tmDetail;
          const before = verificationSnapshot(detail);
          list.push({ text: v, state: 'open', waived: null });
          await persistVerificationMutation(
            taskId,
            detail,
            before,
            `added verification criterion "${v}"`
          );
        };
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); commit(); }
          else if (e.key === 'Escape') { committed = true; renderTmVerification(); }
        });
        input.addEventListener('blur', commit);
        row.appendChild(input);
        wrap.insertBefore(row, add);
        input.focus();
      });
      wrap.appendChild(add);
    }

    function renderTmActivity() {
      const ul = document.getElementById('tmActivity');
      if (!ul) return;
      ul.innerHTML = '';
      if (!tmDetail.activity || !tmDetail.activity.length) {
        const li = document.createElement('li');
        li.className = 'tm-empty';
        li.textContent = (SERVER_MODE || staticTasksFolderVerified)
          ? 'No recorded activity yet — agents append a line here as they work.'
          : 'Select the matching .tasks folder to load the activity log.';
        ul.appendChild(li);
        return;
      }
      [...tmDetail.activity].reverse().forEach(a => {   // newest first
        const li = document.createElement('li');
        li.textContent = a;
        ul.appendChild(li);
      });
    }

    // A board mutation made inside the modal: autosave TASKS.md + re-render (with FLIP),
    // and keep the modal header checkbox in sync.
    function commitBoard() {
      markChanged();
      renderTasks();
      if (tmTask) tmCheckboxEl.className = 'checkbox ' + (tmTask.checked ? 'checked' : '');
    }

    // A refused action gets a short, honest shake (180ms, brand easing) + a status line.
    function denyNudge(msg, el) {
      showStatus(msg);
      const t = el || tmCheckboxEl;
      if (t) { t.classList.remove('deny-shake'); void t.offsetWidth; t.classList.add('deny-shake'); }
    }

    tmCheckboxEl.addEventListener('click', async () => {
      if (!tmTask || tmCompletionPending || tmDeletionPending) return;
      const task = tmTask;
      const completionEpoch = ++tmCompletionEpoch;
      let completionDetailRevision = null;
      tmCompletionPending = true;
      tmTitleEl.disabled = true;
      tmBodyEl.inert = true;
      tmBodyEl.setAttribute('aria-busy', 'true');
      tmBodyEl.style.pointerEvents = 'none';
      tmBodyEl.style.opacity = '0.65';
      renderTmVerification();
      try {
        if (!task.checked) {
          // Completion gates, in order: prerequisites (hard) → subtasks (hard, no waiver) →
          // persisted verification (hard, waivable only by an auditable contract change).
          const unmet = unmetNeeds(task);
          if (unmet.length) {
            denyNudge(`Blocked — finish ${unmet.map(id => '#' + id).join(', ')} before marking done`);
            return;
          }
          if (openSubtasks(task).length) {
            denyNudge('Blocked — finish or remove open subtasks before marking done');
            return;
          }
          if (!SERVER_MODE) {
            denyNudge('Open the live localhost board to complete tasks — static mode cannot atomically bind verification to TASKS.md');
            return;
          }
          if (!tmDetailLoaded) {
            denyNudge('Verification details are unavailable — reload the task details before completion');
            return;
          }
          const detailPersisted = await taskDetailIsPersisted(task.id);
          if (tmTask !== task || completionEpoch !== tmCompletionEpoch) return;
          if (!detailPersisted) {
            denyNudge('Verification changes are not durably saved — resolve the detail-save error before completion');
            return;
          }
          // Re-read the authoritative detail after the local queue drains. This catches an
          // agent or external editor that added/reopened a criterion after the modal loaded.
          try {
            const confirmedSource = await readTaskDetail(task.id);
            if (tmTask !== task || completionEpoch !== tmCompletionEpoch) return;
            tmDetail = parseDetail(confirmedSource.body);
            tmDetailLoaded = true;
            const persistence = detailPersistenceState(task.id);
            persistence.revision = confirmedSource.revision;
            persistence.baseBody = confirmedSource.body;
            persistence.error = null;
            completionDetailRevision = confirmedSource.revision;
            renderTmVerification();
            renderTmActivity();
            refreshTmCounts();
          } catch (e) {
            if (tmTask !== task || completionEpoch !== tmCompletionEpoch) return;
            tmDetailLoaded = false;
            denyNudge('Could not re-read durable verification details — completion remains locked');
            showStatus('Verification refresh failed: ' + e.message);
            return;
          }
          // Board fields can still change while the queue/read awaits. Re-evaluate every
          // non-detail completion gate after the final await; JavaScript then reaches the
          // checked-state mutation without yielding to another UI event.
          const finalUnmet = unmetNeeds(task);
          if (finalUnmet.length) {
            denyNudge(`Blocked — finish ${finalUnmet.map(id => '#' + id).join(', ')} before marking done`);
            return;
          }
          if (openSubtasks(task).length) {
            denyNudge('Blocked — finish or remove open subtasks before marking done');
            return;
          }
          const openV = (tmDetail.verification || []).filter(v => v.state === 'open');
          if (openV.length) {
            denyNudge(`${openV.length} verification check${openV.length > 1 ? 's' : ''} still open — pass each or record an authorized waiver`);
            const sec = document.getElementById('tmVerification');
            if (sec) {
              sec.classList.add('tm-verify-gate');
              sec.scrollIntoView({ behavior: prefersReducedMotion ? 'auto' : 'smooth', block: 'center' });
              setTimeout(() => sec.classList.remove('tm-verify-gate'), 1600);
            }
            return;
          }
          const invalidWaivers = (tmDetail.verification || []).filter(v => !hasAuditableWaiver(v));
          if (invalidWaivers.length) {
            denyNudge(`${invalidWaivers.length} waiver${invalidWaivers.length > 1 ? 's are' : ' is'} missing a dated who-and-reason record — un-waive and record the authorized decision`);
            const sec = document.getElementById('tmVerification');
            if (sec) {
              sec.classList.add('tm-verify-gate');
              sec.scrollIntoView({ behavior: prefersReducedMotion ? 'auto' : 'smooth', block: 'center' });
              setTimeout(() => sec.classList.remove('tm-verify-gate'), 1600);
            }
            return;
          }
        }
        if (tmTask !== task || completionEpoch !== tmCompletionEpoch) return;
        if (task.checked) {
          task.checked = false;
          commitBoard();
          renderTaskModalBody();
        } else {
          await saveVerifiedTaskCompletion(task, completionDetailRevision);
        }
      } finally {
        if (completionEpoch === tmCompletionEpoch) {
          tmCompletionPending = false;
          const contractLocked = !!task.checked;
          tmTitleEl.disabled = contractLocked;
          tmBodyEl.inert = contractLocked;
          tmBodyEl.removeAttribute('aria-busy');
          tmBodyEl.style.pointerEvents = contractLocked ? 'none' : '';
          tmBodyEl.style.opacity = contractLocked ? '0.72' : '';
          if (tmTask === task) renderTmVerification();
        }
      }
    });
    tmTitleEl.addEventListener('change', () => {
      if (!tmTask) return;
      const v = tmTitleEl.value.replace(/\s+/g, ' ').trim();
      if (v && v !== tmTask.title) { tmTask.title = v; commitBoard(); }
      else tmTitleEl.value = tmTask.title;
    });
    document.getElementById('tmClose').addEventListener('click', closeTaskModal);
    document.getElementById('tmDoneBtn').addEventListener('click', closeTaskModal);
    document.getElementById('tmDelete').addEventListener('click', async () => {
      if (!tmTask) return;
      if (tmDetailMutationPending || tmCompletionPending || tmDeletionPending) {
        denyNudge(tmCompletionPending
          ? 'Completion is checking durable state — wait before deleting this task'
          : tmDeletionPending
            ? 'Task deletion is already in progress'
            : 'A task-detail change is still saving — wait before deleting this task');
        return;
      }
      if (!SERVER_MODE) {
        denyNudge('Open the live localhost board to delete tasks — static mode cannot atomically remove both files');
        return;
      }
      if (isSaving) {
        denyNudge('A board save is still finishing — retry deletion when it settles');
        return;
      }
      const t = tmTask;
      if (!(await boardDialog(`Delete "${t.title}"?`))) return;
      tmDeletionPending = true;
      renderTaskModalBody();
      const deleted = await deleteTask(t);
      if (tmTask !== t) return;
      tmDeletionPending = false;
      if (deleted) {
        tmDetailMutationEpoch += 1;
        tmDetailLoadEpoch += 1;
        tmCompletionEpoch += 1;
        hideTaskPanel();
        tmTask = null;
        tmDescEditing = false;
        tmDescDirty = false;
      } else {
        renderTaskModalBody();
      }
    });
    taskModalOverlay.addEventListener('click', (e) => { if (e.target === taskModalOverlay) closeTaskModal(); });

    // ============================================================
    // ===== MILESTONE RAIL + MILESTONE MODAL =====
    // ============================================================
    const milestoneRail = document.getElementById('milestoneRail');
    const msModalOverlay = document.getElementById('msModalOverlay');
    const msTitleEl = document.getElementById('msTitle');
    const msIdEl = document.getElementById('msId');
    const msCheckboxEl = document.getElementById('msCheckbox');
    const msBodyEl = document.getElementById('msBody');

    let msTask = null;                    // the open milestone (live ref into `milestones`)
    let msDescEditing = false;
    let msDescSaving = false;
    let msReloadDeferred = false;
    let msDescExpanded = false;           // read-only description: Show more/less state, survives re-renders
    let railCollapsed = false;
    try { railCollapsed = localStorage.getItem('shaughv-tasks-rail') === 'collapsed'; } catch (_) {}
    let lastMsPct = {};                   // id → last rendered fill %, so the bar sweeps, not jumps
    let lastMsCounts = {};                // id → last "NN/NN" text, for the Slot Roll

    function renderMilestoneRail() {
      if (!SERVER_MODE || !milestoneRail) return;
      milestoneRail.style.display = '';
      milestoneRail.innerHTML = '';

      const header = document.createElement('div');
      header.className = 'ms-rail-header';
      const toggle = document.createElement('button');
      toggle.className = 'ms-rail-toggle';
      toggle.setAttribute('aria-expanded', String(!railCollapsed));
      toggle.setAttribute('aria-controls', 'msRailBody');
      toggle.innerHTML = `${icon('chevron-down', 14)} Milestones <span class="ms-rail-count">${pad2(milestones.length)}</span>`;
      toggle.addEventListener('click', () => {
        railCollapsed = !railCollapsed;
        try { localStorage.setItem('shaughv-tasks-rail', railCollapsed ? 'collapsed' : 'open'); } catch (_) {}
        renderMilestoneRail();
      });
      const newBtn = document.createElement('button');
      newBtn.className = 'ms-new-btn';
      newBtn.innerHTML = `${icon('plus', 12)} New milestone`;
      newBtn.addEventListener('click', () => { railCollapsed = false; renderMilestoneRail(); startAddingMilestone(); });
      header.appendChild(toggle);
      header.appendChild(newBtn);
      milestoneRail.appendChild(header);

      const bodyEl = document.createElement('div');
      bodyEl.className = 'ms-rail-body' + (railCollapsed ? ' collapsed' : '');
      bodyEl.id = 'msRailBody';

      const seenPct = {}, seenCounts = {};
      milestones.forEach((m, i) => {
        const prog = milestoneProgress(m);
        const pct = prog.total ? Math.round((prog.done / prog.total) * 100) : 0;
        const countText = `${pad2(prog.done)}/${pad2(prog.total)}`;
